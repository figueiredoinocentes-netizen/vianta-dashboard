<!doctype html>
<html lang="pt" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock — Vianta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" crossorigin href="/assets/index-DBm4vQ15.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0f0f0f; color: #e2e8f0; font-family: 'Inter', sans-serif; display: flex; min-height: 100vh; }
    .app-layout { display: flex; width: 100%; min-height: 100vh; }
    .sidebar { width: 256px; min-height: 100vh; border-right: 1px solid #1e293b; background: #0a0a0a; display: flex; flex-direction: column; flex-shrink: 0; position: fixed; left: 0; top: 0; z-index: 10; }
    .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 20px 24px; border-bottom: 1px solid #1e293b; }
    .sidebar-logo h1 { font-size: 16px; font-weight: 700; margin: 0; }
    .sidebar-logo p { font-size: 10px; margin: 0; opacity: 0.6; }
    .sidebar-nav { padding: 12px; display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
    .sidebar-pill { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; color: #94a3b8; text-decoration: none; font-size: 14px; transition: all 0.15s; }
    .sidebar-pill:hover { background: #1a1a1a; color: #e2e8f0; }
    .sidebar-pill.active { background: #1a1a1a; color: #e2e8f0; font-weight: 500; }
    .sidebar-section-title { padding: 12px 16px 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #475569; font-weight: 600; }
    .sidebar-sublink { display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 28px; border-radius: 6px; color: #718096; text-decoration: none; font-size: 13px; cursor: pointer; transition: all 0.15s; border: none; background: transparent; width: 100%; text-align: left; }
    .sidebar-sublink:hover { background: #1a1a1a; color: #e2e8f0; }
    .sidebar-sublink.active { background: rgba(59,130,246,0.1); color: #60a5fa; font-weight: 500; }
    .main-content { margin-left: 256px; flex: 1; padding: 24px 32px; max-width: 1400px; }
    .search-wrap { position: relative; width: 100%; margin-bottom: 16px; }
    .search-wrap input { width: 100%; background: #1a1a1a; border: 1px solid #1e293b; border-radius: 8px; padding: 10px 36px 10px 12px; color: #e2e8f0; font-size: 13px; outline: none; }
    .search-wrap input:focus { border-color: #3b82f6; }
    .search-wrap input::placeholder { color: #475569; }
    .search-wrap .clear-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #718096; cursor: pointer; font-size: 16px; padding: 4px; display: none; }
    .search-wrap .clear-btn.visible { display: block; }
    .filters { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
    .filters select { background: #1a1a1a; border: 1px solid #1e293b; border-radius: 8px; padding: 10px 12px; color: #e2e8f0; font-size: 13px; outline: none; min-width: 140px; }
    .filters select:focus { border-color: #3b82f6; }
    .card { background: #1a1a1a; border: 1px solid #1e293b; border-radius: 12px; overflow: hidden; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead { background: #141414; }
    th { padding: 10px 14px; font-size: 11px; font-weight: 600; color: #718096; text-transform: uppercase; letter-spacing: 0.05em; text-align: left; white-space: nowrap; }
    td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #1e293b; }
    tr:hover td { background: #1e1e1e; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
    .badge-venda { background: #1e3a5f; color: #93c5fd; }
    .badge-aluguer { background: #14532d; color: #86efac; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .kpi-card { background: #1a1a1a; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; }
    .kpi-card .val { font-size: 28px; font-weight: 700; }
    .kpi-card .sub { font-size: 11px; color: #718096; margin-top: 2px; }
    @media (max-width: 768px) {
      .sidebar { width: 60px; }
      .sidebar-logo h1, .sidebar-logo p, .sidebar-pill span { display: none; }
      .sidebar-sublink span { display: none; }
      .main-content { margin-left: 60px; padding: 12px; }
      .kpi-grid { grid-template-columns: 1fr; }
      th, td { padding: 8px 10px; font-size: 11px; }
      .filters { flex-direction: column; }
      .filters select { min-width: 100%; }
    }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="https://dashboardaquisicaovianta.lovable.app/assets/vianta-logo-BV7m2ycm.jpeg" alt="Vianta" style="width:36px;height:36px;border-radius:8px;object-fit:contain" />
      <div><h1>VIANTA</h1><p>Fleet Success Hub</p></div>
    </div>
    <nav class="sidebar-nav">
      <div style="display:flex;gap:4px;padding:4px;border-radius:8px;background:rgba(255,255,255,0.04);margin-bottom:8px">
        <a href="/" style="flex:1;text-align:center;font-size:12px;font-weight:600;padding:8px;border-radius:6px;background:rgba(59,130,246,0.12);color:#3b82f6;text-decoration:none">Aquisição</a>
        <a href="/operacoes" style="flex:1;text-align:center;font-size:12px;font-weight:600;padding:8px;border-radius:6px;color:#94a3b8;text-decoration:none;transition:all 0.15s">Operações</a>
      </div>
      <div style="font-size:10px;color:#475569;padding:8px 16px 4px;text-transform:uppercase;letter-spacing:0.05em;font-weight:600">Aquisitions</div>
      <a href="/stock" class="sidebar-pill" style="display:flex;align-items:center;gap:8px;padding:7px 12px 7px 16px;border-radius:6px;color:#60a5fa;font-weight:500;text-decoration:none;font-size:13px;background:rgba(59,130,246,0.1)">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M9 9h.01"/></svg><span>Stock</span>
      </a>
    </nav>
  </aside>
  <main class="main-content">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px">
      <div>
        <h2 style="font-size:20px;font-weight:700;margin:0">Stock — Vianta</h2>
        <p style="margin:4px 0 0;color:#718096;font-size:13px"><span id="totalCount">0</span> viaturas disponíveis</p>
      </div>
      <div style="display:flex;gap:8px">
        <select id="stockFilter" onchange="filterByType()" style="background:#1a1a1a;border:1px solid #1e293b;border-radius:8px;padding:8px 12px;color:#e2e8f0;font-size:13px;outline:none">
          <option value="all">Todos</option>
          <option value="venda">Venda</option>
          <option value="aluguer">Aluguer</option>
        </select>
        <button class="btn btn-outline" onclick="fetchData()" style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid #1e293b;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:#94a3b8">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg> Atualizar
        </button>
      </div>
    </div>
    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="🔍 Pesquisar por modelo ou matrícula..." oninput="applySearch()" />
      <button class="clear-btn" id="clearSearch" onclick="clearSearch()" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:#718096;cursor:pointer;font-size:16px;padding:4px;display:none">✕</button>
    </div>
    <div id="sectionContent"></div>
  </main>
</div>
<script>
const DB_SHEET_ID='1j5RCxSjd24QlPaquRX7C7eeiHrzPo1c6Wsb0OQWFRjQ';
const CSV_URL='https://docs.google.com/spreadsheets/d/'+DB_SHEET_ID+'/export?format=csv';
let allVehicles=[],searchQuery='',typeFilter='all';

function parseCSVLine(l){const r=[];let c='',iq=0;for(let i=0;i<l.length;i++){const ch=l[i];if(iq){if(ch=='"'&&l[i+1]=='"'){c+='"';i++}else if(ch=='"')iq=0;else c+=ch}else{if(ch=='"')iq=1;else if(ch==','){r.push(c);c=''}else c+=ch}}r.push(c);return r}

function fmtAluguer(val){
  if(!val||val==='-')return'-';
  const cleaned=String(val).replace(/[^0-9.,]/g,'').replace(',','.');
  const n=parseFloat(cleaned);
  return isNaN(n)?'-':Math.round(n)+'€/semana';
}

function applySearch(){
  const el=document.getElementById('searchInput');
  searchQuery=(el.value||'').toLowerCase().trim();
  document.getElementById('clearSearch').style.display=searchQuery?'block':'none';
  render();
}
function clearSearch(){
  document.getElementById('searchInput').value='';
  searchQuery='';
  document.getElementById('clearSearch').style.display='none';
  render();
}
function filterByType(){
  typeFilter=document.getElementById('stockFilter').value;
  render();
}
function matchesSearch(v){
  if(!searchQuery)return true;
  const modelo=(v['Marca/Modelo']||'').toLowerCase();
  const matricula=(v['Matrícula']||'').toLowerCase();
  return modelo.includes(searchQuery)||matricula.includes(searchQuery);
}

async function fetchData(){
  try{
    const r=await fetch(CSV_URL);
    const csv=await r.text();
    const lines=csv.trim().split('\n'),headers=parseCSVLine(lines[0]);
    allVehicles=lines.slice(1).map((l,idx)=>{const v=parseCSVLine(l),o={_idx:idx+2};headers.forEach((h,i)=>{o[h]=(v[i]||'').trim()});return o}).filter(v=>v['Marca/Modelo']||v['Matrícula']);
    const STATUS_MAP={'Na Frota Aluguer':'Alugado','Em Stock Stand':'Para Venda','Vendido':'Vendido','Inativo':'Inativo','Manutenção':'Manutenção','Em Preparação':'Em Preparação','Para Aluguer':'Para Aluguer'};
    allVehicles.forEach(v=>{const e=v['Estado'];if(STATUS_MAP[e])v['Estado']=STATUS_MAP[e]});
    render();
  }catch(e){console.error(e)}
}

function render(){
  let f=allVehicles.filter(v=>(v['Estado']==='Para Venda'||v['Estado']==='Para Aluguer')&&matchesSearch(v));
  if(typeFilter==='venda') f=f.filter(v=>v['Estado']==='Para Venda');
  else if(typeFilter==='aluguer') f=f.filter(v=>v['Estado']==='Para Aluguer');
  
  document.getElementById('totalCount').textContent=f.length;
  
  const vendaCount=allVehicles.filter(v=>v['Estado']==='Para Venda').length;
  const aluguerCount=allVehicles.filter(v=>v['Estado']==='Para Aluguer').length;
  
  if(!f.length){
    document.getElementById('sectionContent').innerHTML='<div class="card" style="padding:40px;text-align:center;color:#718096">'+(searchQuery?'Nenhum resultado para "'+searchQuery+'"':'Nenhum carro disponível')+'</div>'+
      '<div class="kpi-grid" style="margin-top:16px">'+
      '<div class="kpi-card"><div class="val" style="color:#93c5fd">'+vendaCount+'</div><div class="label">🏷️ Para Venda</div></div>'+
      '<div class="kpi-card"><div class="val" style="color:#86efac">'+aluguerCount+'</div><div class="label">🔑 Para Aluguer</div></div>'+
      '</div>';
    return;
  }
  
  let html='<div class="kpi-grid">'+
    '<div class="kpi-card"><div class="val" style="color:#93c5fd">'+vendaCount+'</div><div class="label">🏷️ Para Venda</div></div>'+
    '<div class="kpi-card"><div class="val" style="color:#86efac">'+aluguerCount+'</div><div class="label">🔑 Para Aluguer</div></div>'+
  '</div>';
  
  html+='<div class="card"><div class="table-wrap"><table><thead><tr><th>Matrícula</th><th>Modelo</th><th>Ano</th><th>KMs</th><th>Proprietário</th><th>Disponível para</th><th>Preço Venda</th><th>Aluguer/Sem</th></tr></thead><tbody>';
  f.forEach(v=>{
    const tipo=v['Estado']==='Para Venda'?'Venda':'Aluguer';
    html+='<tr><td><strong>'+(v['Matrícula']||'-')+'</strong></td><td>'+(v['Marca/Modelo']||'')+'</td><td>'+(v['Ano']||'')+'</td><td>'+(v['KMs Atuais']||'-')+'</td><td style="font-size:12px">'+(v['Proprietário']||'')+'</td><td><span class="badge '+(tipo==='Venda'?'badge-venda':'badge-aluguer')+'">'+tipo+'</span></td><td>'+(v['Preço Venda (€)']?parseInt(v['Preço Venda (€)']).toLocaleString()+'€':'-')+'</td><td>'+fmtAluguer(v['Valor Aluguer (semanal)'])+'</td></tr>';
  });
  html+='</tbody></table></div></div>';
  document.getElementById('sectionContent').innerHTML=html;
}

fetchData();
</script>
</body>
</html>
