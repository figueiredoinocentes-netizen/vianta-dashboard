<!doctype html>
<html lang="pt" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operações — Dashboard Vianta</title>
    <meta name="description" content="Gestão de Frota Vianta" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" crossorigin href="/assets/index-DBm4vQ15.css" />
    <style>
      :root { --sidebar-w: 256px; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #0f0f0f; color: #e2e8f0; font-family: 'Inter', sans-serif; display: flex; min-height: 100vh; }
      .app-layout { display: flex; width: 100%; min-height: 100vh; }
      .sidebar { width: var(--sidebar-w); min-height: 100vh; border-right: 1px solid #1e293b; background: #0a0a0a; display: flex; flex-direction: column; flex-shrink: 0; position: fixed; left: 0; top: 0; }
      .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 20px 24px; border-bottom: 1px solid #1e293b; }
      .sidebar-logo h1 { font-size: 16px; font-weight: 700; margin: 0; }
      .sidebar-logo p { font-size: 10px; margin: 0; opacity: 0.6; }
      .sidebar-nav { padding: 12px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
      .sidebar-link { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; color: #94a3b8; text-decoration: none; font-size: 14px; transition: all 0.15s; }
      .sidebar-link:hover { background: #1a1a1a; color: #e2e8f0; }
      .sidebar-link.active { background: #1a1a1a; color: #e2e8f0; font-weight: 500; }
      .sidebar-section-title { padding: 12px 16px 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #475569; font-weight: 600; }
      .sidebar-sublink { display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 28px; border-radius: 6px; color: #718096; text-decoration: none; font-size: 13px; cursor: pointer; transition: all 0.15s; border: none; background: transparent; width: 100%; text-align: left; }
      .sidebar-sublink:hover { background: #1a1a1a; color: #e2e8f0; }
      .sidebar-sublink.active { background: rgba(59,130,246,0.1); color: #60a5fa; font-weight: 500; }
      .main-content { margin-left: var(--sidebar-w); flex: 1; padding: 24px 32px; max-width: 1400px; }
      .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
      .stat-card { background: #1a1a1a; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; }
      .stat-card .label { font-size: 12px; color: #718096; margin-bottom: 4px; }
      .stat-card .value { font-size: 24px; font-weight: 700; }
      .section-tabs { display: flex; gap: 4px; margin-bottom: 12px; background: #1a1a1a; border-radius: 8px; padding: 4px; overflow-x: auto; flex-wrap: nowrap; }
      .section-btn { padding: 8px 14px; border: none; background: transparent; color: #718096; border-radius: 6px; cursor: pointer; font-size: 12px; white-space: nowrap; transition: all 0.15s; }
      .section-btn:hover { color: #e2e8f0; background: #2a2a2a; }
      .section-btn.active { background: #2d2d2d; color: #e2e8f0; font-weight: 600; }
      .filters { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; position: relative; }
      .filters input[type="text"] { flex: 1; background: #1a1a1a; border: 1px solid #1e293b; border-radius: 8px; padding: 10px 12px; color: #e2e8f0; font-size: 13px; outline: none; }
      .filters input[type="text"]:focus { border-color: #3b82f6; }
      .filters select { background: #1a1a1a; border: 1px solid #1e293b; border-radius: 8px; padding: 10px 12px; color: #e2e8f0; font-size: 13px; outline: none; min-width: 140px; }
      .filters select:focus { border-color: #3b82f6; }
      .filters .count { font-size: 12px; color: #718096; white-space: nowrap; }
      .card { background: #1a1a1a; border: 1px solid #1e293b; border-radius: 12px; overflow: hidden; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      thead { background: #141414; }
      th { padding: 10px 14px; font-size: 11px; font-weight: 600; color: #718096; text-transform: uppercase; letter-spacing: 0.05em; text-align: left; white-space: nowrap; }
      td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #1e293b; }
      tr:hover td { background: #1e1e1e; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
      .badge-alugado { background: #064e3b; color: #6ee7b7; }
      .badge-venda { background: #1e3a5f; color: #93c5fd; }
      .badge-inativo { background: #3d2e00; color: #fde68a; }
      .badge-maint { background: #78350f; color: #fbbf24; }
      .badge-vendido { background: #1f2937; color: #9ca3af; }
      .badge-prep { background: #312e81; color: #a5b4fc; }
      .badge-aluguer { background: #14532d; color: #86efac; }
      .status-badge { cursor: pointer; transition: filter 0.15s; }
      .status-badge:hover { filter: brightness(1.2); }
      .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; text-decoration: none; }
      .btn-primary { background: #3b82f6; color: white; }
      .btn-primary:hover { background: #2563eb; }
      .btn-outline { background: transparent; border: 1px solid #1e293b; color: #94a3b8; }
      .btn-outline:hover { background: #1a1a1a; color: #e2e8f0; }
      .btn-danger { background: #dc2626; color: white; }
      .btn-danger:hover { background: #b91c1c; }
      .btn-sm { padding: 4px 10px; font-size: 11px; }
      .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
      .modal { background: #1a1a1a; border: 1px solid #1e293b; border-radius: 12px; padding: 24px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
      .modal h2 { font-size: 18px; font-weight: 600; margin: 0 0 20px; }
      .modal .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .modal .full { grid-column: 1 / -1; }
      .modal label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
      .modal input, .modal select { width: 100%; background: #141414; border: 1px solid #1e293b; border-radius: 6px; padding: 8px 10px; color: #e2e8f0; font-size: 13px; outline: none; }
      .modal input:focus, .modal select:focus { border-color: #3b82f6; }
      .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
      .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
      .kpi-card { background: #1a1a1a; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; }
      .kpi-card .val { font-size: 28px; font-weight: 700; }
      .kpi-card .sub { font-size: 11px; color: #718096; margin-top: 2px; }
      .low-stock { color: #ef4444; }
      .warning-stock { color: #f59e0b; }
      .ok-stock { color: #22c55e; }
      @media (max-width: 768px) {
        .sidebar { width: 60px; }
        .sidebar-logo h1, .sidebar-logo p, .sidebar-link span { display: none; }
        .sidebar-sublink span { display: none; }
        .main-content { margin-left: 60px; padding: 16px; }
        .stats-grid { grid-template-columns: 1fr 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <img src="https://dashboardaquisicaovianta.lovable.app/assets/vianta-logo-BV7m2ycm.jpeg" alt="Vianta" style="width:36px;height:36px;border-radius:8px;object-fit:contain" />
          <div><h1>VIANTA</h1><p>Fleet Success Hub</p></div>
        </div>
        <nav class="sidebar-nav">
          <div style="display:flex;gap:4px;padding:4px;border-radius:8px;background:rgba(255,255,255,0.04);margin-bottom:8px">
            <a href="/" style="flex:1;text-align:center;font-size:12px;font-weight:600;padding:8px;border-radius:6px;color:#94a3b8;text-decoration:none;transition:all 0.15s">Aquisição</a>
            <div style="flex:1;text-align:center;font-size:12px;font-weight:600;padding:8px;border-radius:6px;background:rgba(59,130,246,0.12);color:#3b82f6">Operações</div>
          </div>
          <a href="/operacoes" class="sidebar-link"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg><span>Gestão de Frota</span></a>
          <button class="sidebar-sublink active" data-section="visao" onclick="setSection('visao')">📊 Visão Geral</button>
          <button class="sidebar-sublink" data-section="frota" onclick="setSection('frota')">🚗 Frota Ativa</button>
          <button class="sidebar-sublink" data-section="stock" onclick="setSection('stock')">🏪 Stock</button>
          <button class="sidebar-sublink" data-section="manutencao" onclick="setSection('manutencao')">🔧 Manutenções</button>
          <button class="sidebar-sublink" data-section="checkin" onclick="setSection('checkin')">✅ Check-ins</button>
          <button class="sidebar-sublink" data-section="pagamentos" onclick="setSection('pagamentos')">💰 Pagamentos</button>
          <button class="sidebar-sublink" data-section="armazem" onclick="setSection('armazem')">📦 Armazém</button>
        </nav>
      </aside>
      <main class="main-content">
        <div id="app">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <div>
              <h2 style="font-size:20px;font-weight:700;margin:0">Gestão de Frota</h2>
              <p style="margin:4px 0 0;color:#718096;font-size:13px"><span id="sectionLabel">Visão geral</span> • <span id="totalCount">0</span> registos</p>
            </div>
            <div style="display:flex;gap:8px">
              <button class="btn btn-outline" onclick="fetchData()">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg> Atualizar
              </button>
              <button class="btn btn-primary" id="newBtn" onclick="document.getElementById('vehicleModal').style.display='flex'">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg> <span id="newBtnLabel">Nova Viatura</span>
              </button>
            </div>
          </div>
          <div id="sectionContent"></div>
        </div>
        <div id="vehicleModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)this.style.display='none'">
          <div class="modal">
            <h2>Nova Viatura</h2>
            <form onsubmit="event.preventDefault();alert('Viatura registada. DB atualizada.');this.closest('.modal-overlay').style.display='none'">
              <div class="grid">
                <div class="full"><label>Modelo <span style="color:#e53e3e">*</span></label><input name="modelo" required/></div>
                <div><label>Matrícula</label><input name="matricula"/></div>
                <div><label>Ano</label><input name="ano" type="number" min="2010" max="2026"/></div>
                <div><label>Combustível</label><select name="combustivel"><option value="">Selecionar</option><option value="Elétrico">Elétrico</option><option value="Gasóleo/Diesel">Gasóleo/Diesel</option><option value="Gasolina">Gasolina</option><option value="Híbrido">Híbrido</option></select></div>
                <div><label>KMs</label><input name="kms" type="number"/></div>
                <div><label>Cor</label><input name="cor"/></div>
                <div><label>Proprietário</label><select name="proprietario"><option value="VIANTA">VIANTA</option><option value="Investidor">Investidor</option><option value="Miguel Brito Comércio Auto Lda">Miguel Brito</option><option value="Vinod Carsane">Vinod Carsane</option><option value="Ricardo Duarte">Ricardo Duarte</option><option value="EMPRESA">EMPRESA</option><option value="Outro">Outro</option></select></div>
                <div><label>Tipo Gestão</label><select name="gestao"><option value="Aluguer">Aluguer</option><option value="Venda">Venda</option><option value="Slot">Slot</option></select></div>
                <div><label>Estado</label><select name="estado"><option value="Alugado">Alugado</option><option value="Para Venda">Para Venda</option><option value="Para Aluguer">Para Aluguer</option><option value="Em Preparação">Em Preparação</option><option value="Inativo">Inativo</option><option value="Manutenção">Manutenção</option><option value="Vendido">Vendido</option></select></div>
                <div><label>Preço Venda (€)</label><input name="precoVenda" type="number"/></div>
                <div><label>Valor Aluguer (€/sem)</label><input name="precoAluguer" type="number"/></div>
              </div>
              <div class="actions">
                <button type="button" class="btn btn-outline" onclick="this.closest('.modal-overlay').style.display='none'">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
              </div>
            </form>
          </div>
        </div>
        <div id="armazemModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)this.style.display='none'">
          <div class="modal">
            <h2>Novo Item</h2>
            <form onsubmit="event.preventDefault();alert('Item adicionado.');this.closest('.modal-overlay').style.display='none'">
              <div class="grid">
                <div class="full"><label>Item <span style="color:#e53e3e">*</span></label><input name="item" required/></div>
                <div><label>Categoria</label><select name="categoria"><option value="Lubrificantes">Lubrificantes</option><option value="Filtros">Filtros</option><option value="Travões">Travões</option><option value="Pneus">Pneus</option><option value="Fluidos">Fluidos</option><option value="Documentação">Documentação</option><option value="Segurança">Segurança</option><option value="Limpeza">Limpeza</option><option value="Outro">Outro</option></select></div>
                <div><label>Stock Atual</label><input name="stock" type="number"/></div>
                <div><label>Stock Mínimo</label><input name="minimo" type="number"/></div>
                <div><label>Unidade</label><input name="unidade"/></div>
                <div><label>Fornecedor</label><input name="fornecedor"/></div>
              </div>
              <div class="actions">
                <button type="button" class="btn btn-outline" onclick="this.closest('.modal-overlay').style.display='none'">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
    <script>
      const DB_SHEET_ID='1j5RCxSjd24QlPaquRX7C7eeiHrzPo1c6Wsb0OQWFRjQ';
      const CSV_URL='https://docs.google.com/spreadsheets/d/'+DB_SHEET_ID+'/export?format=csv';
      const ARMAZEM_CSV_URL='https://docs.google.com/spreadsheets/d/1oEKDArSrjfpf8xvpWSJVKcCcTfyZKKz5b5AB8Mh8-u8/export?format=csv';
      const API_URL='https://vianta-transfers.netlify.app/.netlify/functions/sheets?type=fleet';
      let allVehicles=[],inventory=[],currentSection='visao';

      const SECTIONS=[
        {id:'visao',label:'📊 Visão Geral'},
        {id:'frota',label:'🚗 Frota Ativa'},
        {id:'stock',label:'🏪 Stock'},
        {id:'manutencao',label:'🔧 Manutenções'},
        {id:'checkin',label:'✅ Check-ins'},
        {id:'pagamentos',label:'💰 Pagamentos'},
        {id:'armazem',label:'📦 Armazém'},
      ];

      const STATUS_MAP={'Na Frota Aluguer':'Alugado','Em Stock Stand':'Para Venda','Vendido':'Vendido','Inativo':'Inativo','Manutenção':'Manutenção','Em Preparação':'Em Preparação','Para Aluguer':'Para Aluguer'};
      const BADGE_MAP={'Alugado':'badge-alugado','Para Venda':'badge-venda','Inativo':'badge-inativo','Manutenção':'badge-maint','Vendido':'badge-vendido','Em Preparação':'badge-prep','Para Aluguer':'badge-aluguer'};
      const STATUSES=['Alugado','Para Venda','Para Aluguer','Em Preparação','Inativo','Manutenção','Vendido'];

      function parseCSVLine(l){const r=[];let c='',iq=0;for(let i=0;i<l.length;i++){const ch=l[i];if(iq){if(ch=='"'&&l[i+1]=='"'){c+='"';i++}else if(ch=='"')iq=0;else c+=ch}else{if(ch=='"')iq=1;else if(ch==','){r.push(c);c=''}else c+=ch}}r.push(c);return r}

      async function fetchData(){
        try{
          const [r1,r2]=await Promise.all([fetch(CSV_URL),fetch(ARMAZEM_CSV_URL)]);
          const csv1=await r1.text(),csv2=await r2.text();
          const lines1=csv1.trim().split('\n'),headers1=parseCSVLine(lines1[0]);
          allVehicles=lines1.slice(1).map((l,idx)=>{const v=parseCSVLine(l),o={_idx:idx+2};headers1.forEach((h,i)=>{o[h]=(v[i]||'').trim()});return o}).filter(v=>v['Marca/Modelo']||v['Matrícula']);
          // Normalize estado to new names
          allVehicles.forEach(v=>{const e=v['Estado'];if(STATUS_MAP[e])v['Estado']=STATUS_MAP[e]});
          // Parse inventory
          const lines2=csv2.trim().split('\n');
          if(lines2.length>1){
            const h2=parseCSVLine(lines2[0]);
            inventory=lines2.slice(1).map((l,idx)=>{const v=parseCSVLine(l),o={_idx:idx+2};h2.forEach((h,i)=>{o[h]=(v[i]||'').trim()});return o}).filter(v=>v['Item']);
          }
          render();
        }catch(e){console.error(e)}
      }

      function setSection(id){
        currentSection=id;
        document.getElementById('sectionLabel').textContent=SECTIONS.find(s=>s.id===id).label;
        document.querySelectorAll('.sidebar-sublink').forEach(b=>b.classList.toggle('active',b.dataset.section===id));
        render();
      }

      function render(){
        const fn={'visao':renderVisao,'frota':renderFrota,'stock':renderStock,'manutencao':renderManutencao,'checkin':renderCheckin,'pagamentos':renderPagamentos,'armazem':renderArmazem};
        const view=fn[currentSection]||renderVisao;
        view();
      }

      // ── Visão Geral ──
      function renderVisao(){
        const s=getStats();
        const totalRenda=allVehicles.filter(v=>v['Estado']==='Alugado'||v['Estado']==='Para Aluguer').reduce((sum,v)=>{const p=parseFloat(String(v['Valor Aluguer (semanal)']||'0').replace(/[^\d.,]/g,''));return sum+(isNaN(p)?0:p*4.33)},0);
        document.getElementById('totalCount').textContent=s.total;
        document.getElementById('sectionContent').innerHTML='<div class="kpi-grid">'+
          '<div class="kpi-card"><div class="val" style="color:#6ee7b7">'+s.frota+'</div><div class="label">🚗 Frota Ativa</div><div class="sub">Alugados na rua</div></div>'+
          '<div class="kpi-card"><div class="val" style="color:#93c5fd">'+s.stock+'</div><div class="label">🏪 Em Stock</div><div class="sub">Para venda / aluguer</div></div>'+
          '<div class="kpi-card"><div class="val" style="color:#fbbf24">'+(s.inativos+s.manutencao)+'</div><div class="label">🔧 Parados</div><div class="sub">Inativo + Manutenção</div></div>'+
          '<div class="kpi-card"><div class="val" style="color:#9ca3af">'+s.vendidos+'</div><div class="label">💰 Vendidos</div><div class="sub">Este ano</div></div>'+
          '<div class="kpi-card"><div class="val" style="color:#22c55e">€'+Math.round(totalRenda).toLocaleString()+'</div><div class="label">📈 Receita Aluguer/mês</div><div class="sub">Estimada (34 alugados)</div></div>'+
          '<div class="kpi-card"><div class="val" style="color:#60a5fa">'+s.total+'</div><div class="label">Total Frota</div><div class="sub">Todas as viaturas</div></div>'+
        '</div><div class="stats-grid">'+
          '<div class="stat-card"><div class="label">Proprietário VIANTA</div><div class="value">'+allVehicles.filter(v=>v['Proprietário']==='VIANTA').length+'</div></div>'+
          '<div class="stat-card"><div class="label">Investidores</div><div class="value">'+allVehicles.filter(v=>v['Proprietário']&&v['Proprietário']!=='VIANTA'&&v['Tipo Gestão']!=='Slot').length+'</div></div>'+
          '<div class="stat-card"><div class="label">Slot</div><div class="value">'+allVehicles.filter(v=>v['Tipo Gestão']==='Slot').length+'</div></div>'+
        '</div>';
      }

      // ── Frota Ativa ──
      function renderFrota(){
        const f=allVehicles.filter(v=>v['Estado']==='Alugado'&&v['Tipo Gestão']!=='Slot');
        document.getElementById('totalCount').textContent=f.length;
        document.getElementById('newBtnLabel').textContent='Nova Viatura';
        document.getElementById('newBtn').setAttribute('onclick',"document.getElementById('vehicleModal').style.display='flex'");
        if(!f.length){
          document.getElementById('sectionContent').innerHTML='<div class="card" style="padding:40px;text-align:center;color:#718096">Nenhum carro alugado de momento</div>';
          return;
        }
        let html='<div class="card"><div class="table-wrap"><table><thead><tr><th>Matrícula</th><th>Modelo</th><th>Motorista</th><th>Gestão</th><th>Proprietário</th><th>Aluguer/Sem</th><th>Estado</th></tr></thead><tbody>';
        f.forEach(v=>{
          html+='<tr><td><strong>'+(v['Matrícula']||'-')+'</strong></td><td>'+(v['Marca/Modelo']||'')+'</td><td>'+(v['Motorista Atual']||'-')+'</td><td style="font-size:12px">'+(v['Tipo Gestão']||'')+'</td><td style="font-size:12px">'+(v['Proprietário']||'')+'</td><td>'+(v['Valor Aluguer (semanal)']||'-')+'</td><td><span class="badge badge-alugado status-badge" onclick="editStatus(this,'+v._idx+',\'Alugado\')" title="Clique para alterar">Alugado</span></td></tr>';
        });
        html+='</tbody></table></div></div>';
        document.getElementById('sectionContent').innerHTML=html;
      }

      // ── Stock ──
      function renderStock(){
        const f=allVehicles.filter(v=>v['Estado']==='Para Venda'||v['Estado']==='Para Aluguer');
        document.getElementById('totalCount').textContent=f.length;
        document.getElementById('newBtnLabel').textContent='Nova Viatura';
        document.getElementById('newBtn').setAttribute('onclick',"document.getElementById('vehicleModal').style.display='flex'");
        if(!f.length){
          document.getElementById('sectionContent').innerHTML='<div class="card" style="padding:40px;text-align:center;color:#718096">Nenhum carro em stock</div>';
          return;
        }
        let html='<div class="card"><div class="table-wrap"><table><thead><tr><th>Matrícula</th><th>Modelo</th><th>Ano</th><th>KMs</th><th>Proprietário</th><th>Preço Venda</th><th>Aluguer/Sem</th><th>Estado</th></tr></thead><tbody>';
        f.forEach(v=>{
          html+='<tr><td><strong>'+(v['Matrícula']||'-')+'</strong></td><td>'+(v['Marca/Modelo']||'')+'</td><td>'+(v['Ano']||'')+'</td><td>'+(v['KMs Atuais']||'-')+'</td><td style="font-size:12px">'+(v['Proprietário']||'')+'</td><td>'+(v['Preço Venda (€)']?v['Preço Venda (€)']+'€':'-')+'</td><td>'+(v['Valor Aluguer (semanal)']||'-')+'</td><td><span class="badge '+(v['Estado']==='Para Venda'?'badge-venda':'badge-aluguer')+' status-badge" onclick="editStatus(this,'+v._idx+',\''+v['Estado']+'\')" title="Clique para alterar">'+(v['Estado']||'')+'</span></td></tr>';
        });
        html+='</tbody></table></div></div>';
        document.getElementById('sectionContent').innerHTML=html;
      }

      // ── Manutenções ──
      function renderManutencao(){
        const f=allVehicles.filter(v=>v['Estado']==='Manutenção');
        document.getElementById('totalCount').textContent=f.length;
        document.getElementById('newBtnLabel').textContent='Nova Viatura';
        document.getElementById('newBtn').setAttribute('onclick',"document.getElementById('vehicleModal').style.display='flex'");
        if(!f.length){
          document.getElementById('sectionContent').innerHTML='<div class="card" style="padding:40px;text-align:center;color:#718096">Nenhum carro em manutenção</div>';
          return;
        }
        let html='<div class="card"><div class="table-wrap"><table><thead><tr><th>Matrícula</th><th>Modelo</th><th>Proprietário</th><th>Estado</th><th>Ação</th></tr></thead><tbody>';
        f.forEach(v=>{
          html+='<tr><td><strong>'+(v['Matrícula']||'-')+'</strong></td><td>'+(v['Marca/Modelo']||'')+'</td><td style="font-size:12px">'+(v['Proprietário']||'')+'</td><td><span class="badge '+(v['Estado']==='Manutenção'?'badge-maint':'badge-inativo')+' status-badge" onclick="editStatus(this,'+v._idx+',\''+v['Estado']+'\')">'+(v['Estado']||'')+'</span></td><td><button class="btn btn-sm btn-outline" onclick="setStatus('+v._idx+',\'Para Venda\')">Marcar Disponível</button></td></tr>';
        });
        html+='</tbody></table></div></div>';
        document.getElementById('sectionContent').innerHTML=html;
      }

      // ── Check-ins ──
      function renderCheckin(){
        const f=allVehicles.filter(v=>v['Estado']==='Em Preparação');
        document.getElementById('totalCount').textContent=f.length;
        document.getElementById('newBtnLabel').textContent='Check-in Manual';
        document.getElementById('newBtn').setAttribute('onclick','alert("Função: registar chegada de viatura + iniciar checklist de preparação");');
        let html='<div class="card" style="padding:40px;text-align:center;color:#718096">';
        if(!f.length){
          html+='Nenhuma viatura em preparação';
        }else{
          html+='<div class="table-wrap"><table><thead><tr><th>Matrícula</th><th>Modelo</th><th>Ação</th></tr></thead><tbody>';
          f.forEach(v=>{
            html+='<tr><td><strong>'+(v['Matrícula']||'-')+'</strong></td><td>'+(v['Marca/Modelo']||'')+'</td><td><button class="btn btn-sm btn-primary" onclick="setStatus('+v._idx+',\'Para Venda\')">Concluir Preparação</button></td></tr>';
          });
          html+='</tbody></table></div>';
        }
        html+='</div>';
        document.getElementById('sectionContent').innerHTML=html;
      }

      // ── Pagamentos ──
      function renderPagamentos(){
        const f=allVehicles.filter(v=>v['Estado']==='Alugado'||v['Tipo Gestão']==='Slot');
        document.getElementById('totalCount').textContent=f.length;
        document.getElementById('newBtnLabel').textContent='Nova Viatura';
        document.getElementById('newBtn').setAttribute('onclick',"document.getElementById('vehicleModal').style.display='flex'");
        if(!f.length){
          document.getElementById('sectionContent').innerHTML='<div class="card" style="padding:40px;text-align:center;color:#718096">Sem dados de pagamento</div>';
          return;
        }
        let html='<div class="card"><div class="table-wrap"><table><thead><tr><th>Motorista</th><th>Viatura</th><th>Matrícula</th><th>Gestão</th><th>Valor/Semana</th></tr></thead><tbody>';
        f.forEach(v=>{
          const valSlot=v['Tipo Gestão']==='Slot'?'35€ (slot)':(v['Valor Aluguer (semanal)']||'-');
          html+='<tr><td><strong>'+(v['Motorista Atual']||'?')+'</strong></td><td>'+(v['Marca/Modelo']||'')+'</td><td>'+(v['Matrícula']||'-')+'</td><td style="font-size:12px">'+(v['Tipo Gestão']||'')+'</td><td>'+valSlot+'</td></tr>';
        });
        html+='</tbody></table></div></div>';
        document.getElementById('sectionContent').innerHTML=html;
      }

      // ── Armazém ──
      function renderArmazem(){
        document.getElementById('totalCount').textContent=inventory.length;
        document.getElementById('newBtnLabel').textContent='Novo Item';
        document.getElementById('newBtn').setAttribute('onclick',"document.getElementById('armazemModal').style.display='flex'");
        if(!inventory.length){
          document.getElementById('sectionContent').innerHTML='<div class="card" style="padding:40px;text-align:center;color:#718096">Nenhum item no armazém</div>';
          return;
        }
        let html='<div class="card"><div class="table-wrap"><table><thead><tr><th>Item</th><th>Categoria</th><th>Stock</th><th>Mínimo</th><th>Unidade</th><th>Fornecedor</th><th>Última Compra</th></tr></thead><tbody>';
        inventory.forEach(v=>{
          const stock=parseInt(v['Stock Atual']||'0');
          const minimo=parseInt(v['Stock Mínimo']||'0');
          const statusClass=stock<minimo?'low-stock':(stock<=minimo?'warning-stock':'ok-stock');
          html+='<tr><td><strong>'+(v['Item']||'')+'</strong></td><td>'+(v['Categoria']||'')+'</td><td class="'+statusClass+'"><strong>'+(v['Stock Atual']||'0')+'</strong></td><td>'+(v['Stock Mínimo']||'0')+'</td><td>'+(v['Unidade']||'')+'</td><td>'+(v['Fornecedor']||'')+'</td><td>'+(v['Última Compra']||'')+'</td></tr>';
        });
        html+='</tbody></table></div></div>';
        document.getElementById('sectionContent').innerHTML=html;
      }

      // ── Helpers ──
      function getStats(){
        return{
          total:allVehicles.length,
          frota:allVehicles.filter(v=>v['Estado']==='Alugado').length,
          stock:allVehicles.filter(v=>v['Estado']==='Para Venda'||v['Estado']==='Para Aluguer').length,
          inativos:allVehicles.filter(v=>v['Estado']==='Inativo').length,
          manutencao:allVehicles.filter(v=>v['Estado']==='Manutenção').length,
          vendidos:allVehicles.filter(v=>v['Estado']==='Vendido').length,
          preparacao:allVehicles.filter(v=>v['Estado']==='Em Preparação').length,
        };
      }

      async function setStatus(rowId,newStatus){
        const v=allVehicles.find(x=>x._idx===rowId);
        if(!v)return;
        await updateCell(v,'Estado',newStatus);
      }

      async function updateCell(v,column,value){
        try{
          const r=await fetch(API_URL,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({row:v._idx,column,value})});
          const d=await r.json();
          if(d.ok){v[column]=value;render();return true}
          else{alert('Erro: '+d.error);return false}
        }catch(e){alert('Erro ao guardar: '+e.message);return false}
      }

      function editStatus(el,rowId,currentValue){
        if(document.querySelector('.status-edit-select'))return;
        const sel=document.createElement('select');
        sel.className='status-edit-select';
        sel.style.cssText='background:#141414;border:1px solid #3b82f6;border-radius:4px;color:#e2e8f0;font-size:11px;font-weight:500;padding:2px 6px;outline:none;cursor:pointer';
        STATUSES.forEach(s=>{
          const opt=document.createElement('option');
          opt.value=s;opt.textContent=s;
          if(s===currentValue)opt.selected=true;
          sel.appendChild(opt);
        });
        sel.addEventListener('change',async()=>{
          const newVal=sel.value;
          sel.remove();
          if(newVal===currentValue)return;
          const v=allVehicles.find(x=>x._idx===rowId);
          if(v)await updateCell(v,'Estado',newVal);
        });
        sel.addEventListener('blur',()=>sel.remove());
        el.textContent='';
        el.appendChild(sel);
        sel.focus();
      }

      fetchData();
    </script>
  </body>
</html>
