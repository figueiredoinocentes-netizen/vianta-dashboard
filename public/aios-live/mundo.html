<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vianta AI OS — Lisboa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#120f1c;--bg2:#1b1630;--bg3:#271f45;--ink:#efe9ff;--mut:#9d93c4;--gold:#ffd166;--ok:#5eead4;--warn:#fbbf24;--bad:#ff6b81;--acc:#a78bfa;--line:#3b2f66;--px:'Press Start 2P',ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:13px/1.45 ui-monospace,Consolas,Menlo,monospace;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
#top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg2);border-bottom:3px solid var(--line);flex-wrap:wrap;position:relative;z-index:30}
.brand{font:10px var(--px);color:var(--gold);letter-spacing:1px;white-space:nowrap}.brand b{color:var(--ok)}
#chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--bg3);border:2px solid var(--line);padding:3px 8px;font-size:12px;white-space:nowrap}
.chip b{color:var(--ok)}.chip.bad{border-color:var(--bad)}.chip.bad b{color:var(--bad)}
.search{position:relative;flex:1;min-width:180px;max-width:360px}
.search input{width:100%;background:#0c0916;border:2px solid var(--line);color:var(--ink);padding:6px 9px;font:inherit}
.search input:focus{outline:none;border-color:var(--gold)}
#res{position:absolute;left:0;right:0;top:100%;background:var(--bg2);border:2px solid var(--gold);z-index:50;max-height:300px;overflow:auto;display:none}
#res div{padding:6px 9px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
#res div.on,#res div:hover{background:var(--bg3)}#res small{color:var(--mut)}
.ctl{display:flex;gap:4px;margin-left:auto}
.ctl button,.btn{background:var(--bg3);border:2px solid var(--line);padding:4px 9px;cursor:pointer;box-shadow:2px 2px 0 #000}
.ctl button.on{background:var(--gold);color:#241a2e;border-color:#fff}
.ctl button:hover,.btn:hover{border-color:var(--gold)}
#body{flex:1;display:flex;min-height:0}
#wrap{flex:1;position:relative;min-width:0;overflow:hidden;background:#3a78b8}
canvas#w{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas#w.pt{cursor:pointer}canvas#w.dr{cursor:grabbing}
.float{position:absolute;background:rgba(18,15,28,.9);border:2px solid var(--line);box-shadow:3px 3px 0 #000}
#banner{left:10px;top:10px;padding:5px 9px;font-size:11px;color:var(--warn);max-width:min(340px,60%)}
#banner b{font:8px var(--px);color:var(--bad);margin-right:6px}
#dist{right:10px;top:10px;width:190px;padding:8px;z-index:5}
#dist h4{margin:0 0 6px;font:8px var(--px);color:var(--gold);display:flex;justify-content:space-between;cursor:pointer}
#dist .row{display:flex;align-items:center;gap:7px;padding:4px 3px;cursor:pointer;border-bottom:1px dashed var(--line)}
#dist .row:hover{background:var(--bg3)}
#dist .sq{width:10px;height:10px;border:2px solid #000;flex:none}
#dist .n{margin-left:auto;color:var(--mut)}
#dist.min .row{display:none}
#log{left:50%;transform:translateX(-50%);bottom:10px;width:min(440px,46%);padding:6px 8px;font-size:11px;min-height:30px}
#log div{padding:1px 0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:fi .4s}
#log div:nth-last-child(n+4){display:none}#log .t{color:var(--mut);margin-right:6px}
@keyframes fi{from{opacity:0;transform:translateY(4px)}}
#mini{left:10px;bottom:10px;border:3px solid var(--line);box-shadow:3px 3px 0 #000;cursor:crosshair;background:#000;image-rendering:pixelated}
#help{right:10px;bottom:10px;padding:4px 8px;font-size:11px;color:var(--mut)}
#tip{position:absolute;pointer-events:none;background:#0c0916;border:2px solid var(--gold);padding:3px 7px;font-size:12px;display:none;z-index:20;white-space:nowrap}
#panel{width:350px;border-left:3px solid var(--line);background:var(--bg2);padding:14px;overflow:auto;flex:none}
@media(max-width:900px){#body{flex-direction:column}#panel{width:auto;max-height:40vh;border-left:0;border-top:3px solid var(--line)}#dist,#help{display:none}}
#panel .head{display:flex;gap:12px;align-items:center}
#panel .th{width:84px;height:84px;background:#2c5a33;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:3px 3px 0 #000;font-size:38px}
#panel .th canvas{image-rendering:pixelated;max-width:100%;max-height:100%}
#panel .kind{font:7px var(--px);color:var(--mut);margin-bottom:5px}
#panel h2{margin:0;font-size:15px}
.st{display:inline-block;padding:1px 7px;font-size:11px;border:2px solid;margin-top:5px}
.st.ok{color:var(--ok)}.st.down{color:var(--bad)}.st.pend,.st.paused{color:var(--warn)}.st.human{color:var(--acc)}
#panel p{margin:10px 0 0}
#panel h3{font:7px var(--px);color:var(--gold);margin:16px 0 6px;text-transform:uppercase}
.lk{display:inline-block;border:2px solid var(--line);background:var(--bg3);padding:2px 7px;margin:2px;cursor:pointer;font-size:12px}
.lk:hover{border-color:var(--gold)}.lk.dim{opacity:.45;cursor:default}
table{border-collapse:collapse;width:100%;margin-top:8px}td{padding:3px 0;border-bottom:1px dashed var(--line);vertical-align:top}td:first-child{color:var(--mut);width:38%}
.hint{color:var(--mut);font-size:12px}
.acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.btn.gold{background:var(--gold);color:#241a2e;border-color:#fff;font-weight:bold}
/* interior */
#room{position:absolute;inset:14px;background:#f3f6ff;border:4px solid #000;box-shadow:0 0 0 3px var(--gold),8px 8px 0 #000;z-index:40;display:none;flex-direction:column;overflow:hidden}
#room.show{display:flex}
.rbar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#120d1c;border-bottom:4px solid #000}
.rbar .rt{font:11px var(--px);color:var(--gold)}.rbar .rs{color:var(--mut);font-size:12px}
.rbar button{margin-left:auto}
#rbody{flex:1;overflow:auto;padding:16px;background-color:#f3f6ff;background-image:linear-gradient(#2f5fb533 2px,transparent 2px),linear-gradient(90deg,#2f5fb533 2px,transparent 2px),radial-gradient(circle,#2f5fb566 0 5px,transparent 6px);background-size:36px 36px,36px 36px,36px 36px}
.sec{font:8px var(--px);color:#16346e;margin:4px 0 8px}
.shelf{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:#ffffffcc;border:3px solid #16346e;border-bottom:8px solid #16346e;margin-bottom:16px}
.rule{background:#120d1c;border:2px solid var(--gold);padding:10px 12px;margin-bottom:14px;font-size:12px}
.rule b{color:var(--gold)}
.it{position:relative;cursor:pointer;border:3px solid #000;padding:8px 10px;min-width:120px;max-width:210px;box-shadow:3px 3px 0 #000;transition:transform .08s}
.it:hover{transform:translateY(-3px)}.it.on{outline:3px solid var(--ok);outline-offset:2px}
.it b{display:block;font-size:12px;word-break:break-word}.it i{display:block;font-style:normal;font-size:11px;opacity:.75;margin-top:2px}
.it.scroll{background:#f1e4c3;color:#3a2415;border-radius:2px 14px 2px 14px}
.it.scroll::after{content:'';position:absolute;right:6px;top:-7px;width:12px;height:12px;border:2px solid #000;border-radius:50%;background:var(--ok)}
.it.scroll.off{background:#cfc5ac}.it.scroll.off::after{background:#8b8498}
.it.book{background:var(--bk,#3f6fc4);color:#fff;min-width:46px;max-width:none;width:62px;height:150px;padding:6px 4px;border-radius:2px}
.it.book b{writing-mode:vertical-rl;transform:rotate(180deg);height:100%;font-size:11px;margin:auto}.it.book i{display:none}
.it.book.empty{background:transparent;border-style:dashed;color:var(--warn)}
.it.crate{background:#b08455;color:#2a1a0c;background-image:linear-gradient(135deg,transparent 46%,#00000033 46% 54%,transparent 54%)}
.it.mission{background:#1b1630;border-left-width:10px;min-width:210px}
.it.mission.ok{border-left-color:var(--ok)}.it.mission.paused{border-left-color:var(--warn)}.it.mission.err{border-left-color:var(--bad)}
.it.slot{background:#1b1630;min-width:100px}
.it.empty{opacity:.7}
</style>
</head>
<body>
<header id="top">
  <div class="brand">▶ VIANTA <b>AI OS</b></div>
  <div id="chips"></div>
  <div class="search"><input id="q" placeholder="Procurar agente, skill, ficheiro…   ( / )" autocomplete="off"><div id="res"></div></div>
  <div class="ctl">
    <button data-s="0" title="Pausa (espaço)">⏸</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button>
    <button id="tn" title="Dia / noite (N)">🌙</button><button id="tl" class="on" title="Etiquetas">🏷</button><button id="fit" title="Ver tudo (F)">⤢</button>
  </div>
</header>
<div id="body">
  <div id="wrap">
    <canvas id="w"></canvas>
    <div id="banner" class="float"><b>SIMULAÇÃO</b>Snapshot do /aios (há 3 dias). Carros dos agentes e elétricos = dados reais (cada elétrico é um cron). Carros cinzentos = decoração. Não é tempo real.</div>
    <div id="dist" class="float min"></div>
    <div id="log" class="float"></div>
    <canvas id="mini" class="float" width="180" height="115"></canvas>
    <div id="help" class="float">arrastar · roda=zoom · clique · duplo-clique=entrar · / pesquisar</div>
    <div id="tip"></div>
    <div id="room"><div class="rbar"><span class="rt" id="rt"></span><span class="rs" id="rs"></span><button class="btn" id="rx">✕ Esc</button></div><div id="rbody"></div></div>
  </div>
  <aside id="panel"></aside>
</div>

<script type="module">
/* ===================== DADOS (snapshot /aios + CLAUDE.md) ===================== */
const AG = {
  jarvis:{n:'Jarvis',role:'CEO / Orquestrador',st:'ok',meta:'gateway up · PID 6448',ints:['ghl','composio','gmail','telegram','desktop']},
  'agente-comercial':{n:'Agente Comercial',role:'Bot Comercial TVDE',st:'down',meta:'gateway down',ints:['ghl','supabase','fbig']},
  'turismo-frota':{n:'Turismo / ChoiceCar',role:'Bot Turismo',st:'down',meta:'gateway down',ints:['supabase','sheets','gmail','composio']},
  francisco:{n:'Francisco',role:'Humano',st:'human',meta:'sem gateway (humano)',ints:[]},
  duarte:{n:'Duarte',role:'Humano',st:'human',meta:'sem gateway (humano)',ints:[]},
  vianta:{n:'Equipa Vianta',role:'Humano',st:'human',meta:'sem gateway (humano)',ints:[]},
};
const CR = [
 {o:'francisco',n:'Agente Comercial — Draft (2 min)',s:'every 2m',st:'paused',last:'19d',sk:['vianta-agente-mestre','vianta-resposta-interessados']},
 {o:'francisco',n:'Isabel Teixeira — reply monitor',s:'every 3m',st:'ok',last:'3d',sk:['vianta-resposta-interessados']},
 {o:'jarvis',n:'Auto-responder FB/IG (3 min)',s:'every 3m',st:'paused',last:'15d',sk:[]},
 {o:'jarvis',n:'GHL daily report (10h)',s:'todos os dias 10:00',st:'ok',last:'4d',sk:[]},
 {o:'agente-comercial',n:'Agente Comercial — Resposta direta (1 min)',s:'every 1m',st:'ok',last:'3d',sk:['vianta-agente-mestre','vianta-resposta-interessados']},
 {o:'jarvis',n:'Monitor Stock Venda — Novos Carros',s:'segundas 11:00',st:'ok',last:'8d',sk:['vianta-email-marketing']},
 {o:'turismo-frota',n:'[bot:turismo-frota] ChoiceCar sync check',s:'every 30m',st:'ok',last:'3d',sk:['vianta-base-dados','vianta-choicecar-planeamento']},
 {o:'jarvis',n:'[AI OS] Snapshot live (10 min)',s:'every 10m',st:'ok',last:'3d',sk:[]},
 {o:'jarvis',n:'[vianta] choicecar-driver-composio',s:'every 120m',st:'ok',last:'3d',sk:[]},
 {o:'jarvis',n:'choicecar-driver-vianta',s:'every 120m',st:'paused',last:'5d',sk:[],err:'Token refresh failed: invalid_grant'},
];
const SK = {
 'vianta-agente-mestre':['System prompt do Agente Comercial TVDE. Processa leads, consulta stock Supabase, responde via GHL. Canal-independente.',['supabase','ghl'],[]],
 'vianta-aios-live':['Dashboard live do AI OS: snapshot, serve ou fix.',[],[]],
 'vianta-assistente-voz':['Assistente de voz Vianta (mic, voice server, tunnel).',[],[]],
 'vianta-base-dados':['Criação/manutenção de bases de dados e modelação financeira/de negócio a partir de várias fontes.',['supabase','sheets'],[]],
 'vianta-choicecar-planeamento':['Planeamento ChoiceCar: ler emails e atribuir motoristas.',['gmail'],[]],
 'vianta-comercial':['Hub comercial Vianta — ICP, ofertas, posicionamento.',[],['c-icp','c-oferta','c-pos']],
 'vianta-composio':['Integrações e migrações Composio/MCP.',['composio'],[]],
 'vianta-descricao':['Legendas orgânicas, com o tom de voz da marca.',[],['c-tom']],
 'vianta-dns-workspace':['DNS, Google Workspace, email — domínios e reencaminhamento.',['gmail'],[]],
 'vianta-edicao-video':['Editar vídeo: sincronizar áudio, cortar pausas, legendas, exportar.',[],[]],
 'vianta-email-marketing':['Emails de stock aos motoristas da frota. Pré-visualizar e enviar.',['gmail'],[]],
 'vianta-ghl-lead-automation':['Auto-resposta GHL: cron, monitores, scripts.',['ghl'],[]],
 'vianta-onboarding-motorista':['Onboarding de motoristas: docs, entrega, CRM.',[],[]],
 'vianta-operacoes':['Dashboard operações: secções, sidebar, estado, inventário.',[],[]],
 'vianta-orquestracao':['Criar/gerir perfis de bots e delegação do CEO.',[],[]],
 'vianta-programa-referenciacao':['Referenciação Vianta: script direto estilo Publio para contactos.',[],[]],
 'vianta-propostas-venda':['Criar/enviar propostas de venda TVDE.',['netlify'],['c-oferta']],
 'vianta-report-aquisicao':['Relatórios de aquisição TVDE.',[],[]],
 'vianta-resposta-interessados':['DMs a leads TVDE com dados reais da sheet.',['sheets'],['c-oferta','c-tom']],
 'vianta-retoma':['Retoma: pesquisa de mercado + apresentar valor. Escalar só em contraproposta.',[],[]],
 'vianta-thumbnail':['Thumbnails Vianta: brand frame + prompt ChatGPT.',[],[]],
 'vianta-turismo-propostas':['Propostas a parceiros de Turismo. Estilo: Tivoli.',[],['c-tur']],
 'vianta-web-dev':['Alterar as web apps: transfers, dashboard, netlify.',['netlify'],[]],
};
const INT = {
 ghl:['GHL CRM','ok','contactos · pipelines Aluguer + Venda · Messenger/IG · health OK (200)'],
 supabase:['Supabase','ok','fonte de verdade: stock carros, transfers, cc_*'],
 composio:['Composio MCP','ok','Gmail · Sheets · Drive (conta duarte.inocentes@vianta.pt)'],
 sheets:['Google Sheets','ok','DB Transfers · Drivers Transfers · propostas'],
 gmail:['Gmail','ok','geral@vianta.pt via Composio'],
 frota360:['Frota360','ok','sync diário → Supabase'],
 meta:['Meta Ads API','down','conta 293842623 · sem token (bloqueado)'],
 drive:['Google Drive','ok','docs fonte autoritativa'],
 netlify:['Netlify','ok','app transfers · gerador propostas · dashboard'],
};
const CH = {telegram:['Telegram','Vianta Jarvis'],desktop:['Desktop','Hermes app'],fbig:['Facebook / Instagram','via GHL'],email:['Email','geral@vianta.pt']};
const CTX = [
 ['c-estrat','estrategia-vianta.md','Objetivo, gargalo atual e métricas. AINDA NÃO EXISTE — bloqueado em números reais do Francisco.','pend'],
 ['c-gov','governanca-agentes.md','Regras Tier 0 (autónomo) / Tier 1 (precisa de aprovação humana).','ok'],
 ['c-mem','memory.md','Exclusões de segurança, decisões tomadas, pontos por confirmar.','ok'],
 ['c-sobre','sobre-a-empresa.md','Identidade legal, história, duas linhas de negócio, pessoas.','ok'],
 ['c-icp','icp-tvde.md','ICP (Segmento A/B) e Dream Follower do TVDE.','ok'],
 ['c-pos','posicionamento-tvde.md','Frase de posicionamento e diferenciação vs 5 concorrentes.','ok'],
 ['c-oferta','oferta-tvde.md','As 3 ofertas TVDE: Aluguer, Slot, Venda.','ok'],
 ['c-mercado','mercado-e-concorrencia-tvde.md','Panorama de conteúdo TVDE, gaps, TAM/SAM/SOM.','ok'],
 ['c-reg','regulacao-tvde-2026.md','Nova Lei TVDE 2026 e implicações internas.','ok'],
 ['c-tur','turismo-vianta-prestige.md','Segmentos, proposta de valor e pricing do Turismo.','ok'],
 ['c-tom','tom-de-voz.md','Regra de tom neutro/realista para conteúdo com números.','ok'],
 ['c-perfil','perfil-clientes-reais-tvde.md','Os 4 fechos reais de venda de viaturas — padrões.','ok'],
 ['c-funil','funil-e-metricas-tvde.md','Etapas do funil CRM e escada de métricas.','ok'],
 ['c-teste','teste-criativo-vs-mecanismo-2026-08.md','CAC por ad set e teste A/B/C em curso.','ok'],
 ['c-sop','SOPs por departamento (Google Docs)','AQUISIÇÃO/Processos, OPERAÇÕES/Processos — documentos vivos, não duplicados.','ok'],
];
const DATA = [
 ['d-carros','Supabase · carros','151 registos — stock de viaturas (fonte única).','supabase'],
 ['d-transfers','Supabase · transfers','167 registos.','supabase'],
 ['d-ccs','Supabase · cc_services','87 registos (ChoiceCar).','supabase'],
 ['d-cco','Supabase · cc_offers','87 registos (ChoiceCar).','supabase'],
 ['d-leads','Sheet · DB Leads Log','RAW_LEADS + RAW_EVENTS — base das análises de ads.','sheets'],
 ['d-frota','Sheet · Frota de Viaturas','Preços de viaturas (AQUISIÇÃO/Vendas).','sheets'],
 ['d-dbt','Sheet · DB Transfers','Marcações de transfers/tours do Turismo.','sheets'],
 ['d-f360','Frota360','Sync diário → Supabase. Gestão real de frota/motoristas.','frota360'],
];

/* ===== dados vivos: /aios-live/aios-state.json (mesmo snapshot do painel) ===== */
let LIVE=null;
try{const r=await fetch('/aios-live/aios-state.json?t='+Date.now());if(r.ok)LIVE=await r.json()}catch(e){}
const NCARS=(LIVE&&LIVE.supabase&&LIVE.supabase.carros)||151;
function applyLive(L){
  const rel=iso=>{if(!iso)return '—';const s=(Date.now()-new Date(iso))/1000;return s<60?'agora':s<3600?Math.floor(s/60)+'min':s<86400?Math.floor(s/3600)+'h':Math.floor(s/86400)+'d'};
  (L.profiles||[]).forEach(p=>{const a=AG[p.name];if(!a)return;const human=/^Humano/.test(p.role||'');
    a.role=p.role||a.role;a.st=human?'human':(p.gateway&&p.gateway.up?'ok':'down');
    a.meta=human?'sem gateway (humano)':(p.gateway&&p.gateway.up?'gateway up'+(p.gateway.pid?' · PID '+p.gateway.pid:''):'gateway em baixo')});
  const seen=new Set(),nc=[];
  (L.profiles||[]).forEach(p=>(p.crons||[]).forEach(c=>{if(seen.has(c.id))return;seen.add(c.id);
    nc.push({o:AG[c.owner]?c.owner:(AG[p.name]?p.name:'jarvis'),n:c.name,s:c.schedule||'—',st:c.state==='paused'?'paused':'ok',last:rel(c.last_run_at),sk:c.skills||[],
      err:c.last_status==='error'?((c.last_error||'erro').replace(/\s+/g,' ').slice(0,110)):undefined})}));
  if(nc.length){CR.length=0;nc.forEach(c=>CR.push(c))}
  if(L.skills&&L.skills.length){const old={};Object.keys(SK).forEach(k=>{old[k]=SK[k];delete SK[k]});
    L.skills.forEach(s=>{const o=old[s.name];SK[s.name]=[s.description||(o&&o[0])||'',o?o[1]:[],o?o[2]:[]]})}
  const ik={meta:'meta_ads'};
  Object.keys(INT).forEach(k=>{let ok=null,note=null;const li=(L.integrations||{})[ik[k]||k];
    if(li){ok=li.ok;note=li.note}
    else if(k==='ghl'&&L.ghl){ok=L.ghl.ok;note='health '+(L.ghl.ok?'OK':'FALHA')+' ('+L.ghl.status+') · pipelines Aluguer + Venda · Messenger/IG'}
    else if(k==='supabase'&&L.supabase){ok=Object.values(L.supabase).some(v=>v!=null)}
    else if(k==='composio'&&L.mcp){ok=L.mcp.some(m=>m.name==='composio')}
    if(ok===false)INT[k][1]='down';
    if(note)INT[k][2]=note+(ok===null?' (estado por confirmar)':'')});
  const sc=L.supabase||{},map={'d-carros':'carros','d-transfers':'transfers','d-ccs':'cc_services','d-cco':'cc_offers'};
  DATA.forEach(d=>{const key=map[d[0]];if(key&&sc[key]!=null)d[2]=d[2].replace(/^\d+/,sc[key])});
}
if(LIVE)applyLive(LIVE);
const DISTRICT={ 'L-estr':['Miradouro da Estratégia','O porquê: objetivo, gargalo, métricas e regras de governo.'],
 'L-ctx':['Arquivo · Context','Conhecimento de fundo do negócio (pasta context/ + SOPs).'],
 'L-data':['Parque · Data','Dados vivos em Supabase, Sheets e Frota360.'],
 'L-skills':['Oficina · Skills','As 23 skills Vianta. Cada uma abre com a sua descrição.'],
 hq:['Sede Vianta · Missões','Sede: todos os crons (rotinas agendadas), cada um representado por um elétrico, e quem os executa.']};
const LAYER_ITEMS={'L-estr':['c-estrat','c-gov'],'L-ctx':CTX.slice(2).map(c=>c[0]),'L-data':DATA.map(d=>d[0]),'L-skills':Object.keys(SK),hq:CR.map(c=>'cr:'+c.n)};

const events=[];
function bubbleFor(a,d){
  if(d===homeOf(a.id))return '🏠 de volta ao posto';
  if(d==='L-skills'){const s=skOf(a.id);return '🔧 '+((s[(Math.random()*s.length)|0]||'skill').replace('vianta-',''))}
  if(d==='L-ctx')return '📖 a consultar contexto';
  if(d==='L-estr')return '🔭 a rever governança';
  if(d==='hq')return '🏢 a orquestrar';
  if(CH[d])return '📨 '+CH[d][0];
  if(INT[d])return '🔌 '+INT[d][0];
  return '…'}
function pushEvent(a,txt){events.push({a:a.id,t:new Date(),txt});if(events.length>30)events.shift();renderLog()}
function update(dt){
  agents.forEach(a=>{
    a.bt=Math.max(0,a.bt-dt);if(!a.walks)return;
    if(a.path.length){a.working=false;const [tx,ty]=N[a.path[0]];const dx=tx-a.x,dy=ty-a.y,dist=Math.hypot(dx,dy),mv=a.speed*dt;a.step+=dt*7;
      if(Math.abs(dx)>=Math.abs(dy)){if(Math.abs(dx)>.5){a.dir=dx>0?1:-1;a.orient='h'}}else{a.dir=dy>0?1:-1;a.orient='v'}
      if(dist<=mv){a.x=tx;a.y=ty;a.node=a.path.shift();
        if(!a.path.length&&a.dest){a.bubble=bubbleFor(a,a.dest);a.bt=3.4;a.wait=2.5+Math.random()*3.5;a.arrived=a.dest;a.working=true;if(a.dest!==homeOf(a.id))pushEvent(a,a.bubble)}}
      else{a.x+=dx/dist*mv;a.y+=dy/dist*mv}
    }else{a.wait-=dt;
      if(a.wait<=0&&a.dests.length){let d=a.dests[(Math.random()*a.dests.length)|0];if(Math.random()<.22&&a.arrived!==homeOf(a.id))d=homeOf(a.id);
        const tn=d===homeOf(a.id)?a.home:BID[d].node;a.dest=d;a.path=bfs(a.node,tn).slice(1);if(!a.path.length){a.bubble=bubbleFor(a,d);a.bt=2;a.wait=2}}}
  });
  trams.forEach(t=>{if(t.running)t.s+=26*dt});
  amb.forEach(c=>{if(!c.next){const o=E[c.node].filter(n=>!n.startsWith('D_')&&n!==c.prev);const pool=o.length?o:E[c.node].filter(n=>!n.startsWith('D_'));c.next=pool[(Math.random()*pool.length)|0]}
    const [tx,ty]=N[c.next],dx=tx-c.x,dy=ty-c.y,dist=Math.hypot(dx,dy),mv=c.speed*dt;

    if(dist<=mv){c.x=tx;c.y=ty;c.prev=c.node;c.node=c.next;c.next=null}else{c.x+=dx/dist*mv;c.y+=dy/dist*mv}})}

  if(dark<.2){for(let i=0;i<3;i++){const cx=((t*3+i*260)%(W+160))-80,cy=70+i*120;g.fillStyle='rgba(20,30,60,.10)';g.beginPath();g.ellipse(cx,cy,46,16,0,0,7);g.fill()}}
  drawBuildings(g,t,dark);
  const ents=[];
  agents.forEach(a=>ents.push([a.y,()=>{g.globalAlpha=dimmed(a.id)?.4:1;drawAgent(g,a,t);g.globalAlpha=1}]));
  trams.forEach(tr=>{const p=trPos(tr);ents.push([p.y+(p.orient==='v'?0:3),()=>{g.globalAlpha=dimmed(tr.id)?.4:1;drawTram(g,tr,t);g.globalAlpha=1}])});
  amb.forEach(c=>ents.push([c.y,()=>{g.globalAlpha=relSet?.3:1;car(g,c.x,c.y,{body:c.col},c.orient,c.dir,false,t,false);g.globalAlpha=1}]));
  ents.sort((a,b)=>a[0]-b[0]).forEach(e=>e[1]());
  drawLinks(g,t);
  const ring=(x,y,w,h,c)=>{g.fillStyle=c;const n=2*(w+h);for(let i=0;i<n;i+=4){const p=(i+t*20)%n;let px,py;if(p<w){px=x+p;py=y}else if(p<w+h){px=x+w;py=y+p-w}else if(p<2*w+h){px=x+w-(p-w-h);py=y+h}else{px=x;py=y+h-(p-2*w-h)}g.fillRect(Math.round(px),Math.round(py),2,2)}};
  const ringFor=(id,c)=>{if(AGM[id]){const a=AGM[id];ring(a.x-13,a.y-18,26,22,c)}else{const tr=trams.find(q=>q.id===id);if(tr){const p=trPos(tr);if(p.orient==='h')ring(p.x-20,p.y-21,40,26,c);else ring(p.x-10,p.y-28,20,32,c)}else{const b=BID[id];if(b)ring(b.ox-4,b.oy-4,b.w+8,b.h+8,c)}}};
  if(sel){const sid=AGM[sel]||trams.some(q=>q.id===sel)||BID[sel]?sel:districtOf(sel);if(sid)ringFor(sid,'#5eead4')}
  if(hover&&hover!==sel)ringFor(hover,'#ffffff99');
  if(dark>0){g.fillStyle=`rgba(8,10,48,${dark})`;g.fillRect(0,0,W,H);
    g.globalCompositeOperation='lighter';lamps.forEach(([x,y])=>{const gr=g.createRadialGradient(x,y-14,1,x,y-14,34);gr.addColorStop(0,`rgba(255,200,90,${dark*.7})`);gr.addColorStop(1,'rgba(255,200,90,0)');g.fillStyle=gr;g.fillRect(x-36,y-50,72,72)});
    trams.forEach(tr=>{if(!tr.running)return;const p=trPos(tr),fx=p.x+(p.orient==='h'?p.dir*22:0),fy=p.y-(p.orient==='h'?5:8)+(p.orient==='v'?p.dir*12:0),gr=g.createRadialGradient(fx,fy,1,fx,fy,26);gr.addColorStop(0,`rgba(255,240,170,${dark*.6})`);gr.addColorStop(1,'rgba(255,240,170,0)');g.fillStyle=gr;g.fillRect(fx-28,fy-28,56,56)});
    g.globalCompositeOperation='source-over';
    BL.forEach(b=>{if(AG[b.id]&&AG[b.id].st==='down')return;b.dyn.wins.forEach(([x,y,w,h])=>{R(g,b.ox+x,b.oy+y,w,h,'#ffd166');R(g,b.ox+x,b.oy+y,w,1,'#fff3b0')})});
    g.globalCompositeOperation='lighter';BL.forEach(b=>{if(AG[b.id]&&AG[b.id].st==='down')return;const gr=g.createRadialGradient(b.x,b.y-4,2,b.x,b.y-4,b.w*.8);gr.addColorStop(0,`rgba(255,190,80,${dark*.35})`);gr.addColorStop(1,'rgba(255,190,80,0)');g.fillStyle=gr;g.fillRect(b.x-b.w,b.y-b.w*.8,b.w*2,b.w*1.6)});g.globalCompositeOperation='source-over'}
}
function pillS(g,s,x,y,o={}){g.font=(o.size||10)+'px ui-monospace,Consolas,monospace';g.textAlign='center';const w=g.measureText(s).width+8;g.fillStyle=o.bg||'rgba(18,15,28,.88)';g.fillRect(Math.round(x-w/2),Math.round(y-10),Math.round(w),14);g.strokeStyle=o.bd||'#3b2f66';g.lineWidth=1;g.strokeRect(Math.round(x-w/2)+.5,Math.round(y-10)+.5,Math.round(w),14);g.fillStyle=o.fg||'#efe9ff';g.fillText(s,Math.round(x),Math.round(y+1))}
function drawScreen(g,t){
  g.setTransform(dpr,0,0,dpr,0,0);
  if(showLabels){{const [rx,ry]=w2s(670,264);pillS(g,'Remise · crons pausados',rx,ry)}BL.forEach(b=>{if(dimmed(b.id))return;const [sx,sy]=w2s(b.x,b.y+3);pillS(g,b.label,sx,sy+10,{size:cam.z>3?11:10})});
    agents.forEach(a=>{if(dimmed(a.id))return;if(!(a.path.length||a.id===sel||a.id===hover||cam.z>3.2))return;const [sx,sy]=w2s(a.x,a.y);pillS(g,a.n.split(' ')[0],sx,sy+(a.bt>0?-2:12)-(a.bt>0?agH(a)*cam.z:0)+(a.bt>0?0:0),{size:10,bd:a.sleeping?'#555':'#a78bfa',fg:a.sleeping?'#9d93c4':'#efe9ff'})})}
  agents.forEach(a=>{if(a.bt<=0)return;const [sx,sy]=w2s(a.x,a.y-agH(a));const s=a.bubble;g.font='11px ui-monospace,Consolas,monospace';g.textAlign='center';const w=g.measureText(s).width+14;g.globalAlpha=Math.min(1,a.bt);
    g.fillStyle='#fff';g.fillRect(Math.round(sx-w/2),Math.round(sy-26),Math.round(w),20);g.fillRect(Math.round(sx-4),Math.round(sy-6),8,4);g.fillRect(Math.round(sx-2),Math.round(sy-2),4,3);
    g.strokeStyle='#241a2e';g.lineWidth=2;g.strokeRect(Math.round(sx-w/2),Math.round(sy-26),Math.round(w),20);g.fillStyle='#241a2e';g.fillText(s,Math.round(sx),Math.round(sy-12));g.globalAlpha=1});
}
function drawMini(){
  mc.imageSmoothingEnabled=false;mc.drawImage(terrain,0,0,180,115);const s=180/W;
  BL.forEach(b=>{mc.fillStyle=b.dc;mc.fillRect(b.x*s-3,(b.y-b.h/2)*s-2,6,4)});
  agents.forEach(a=>{mc.fillStyle=a.sleeping?'#777':'#fff';mc.fillRect(a.x*s-1,a.y*s-2,3,3)});trams.forEach(tr=>{const p=trPos(tr);mc.fillStyle=tr.running?'#f2b705':'#b98400';mc.fillRect(p.x*s-2,p.y*s-1,4,2)});
  if(sel&&relSet){mc.strokeStyle='#ffd166';[...relSet].filter(i=>BID[i]).forEach(i=>{const b=BID[i];mc.strokeRect(b.x*s-5,(b.y-b.h/2)*s-4,10,8)})}
  mc.strokeStyle='#fff';mc.lineWidth=1.5;const vw=cw/cam.z,vh=ch/cam.z;mc.strokeRect((cam.x-vw/2)*s,(cam.y-vh/2)*s,vw*s,vh*s)}

/* input */
const tip=document.getElementById('tip');
function hit(wx,wy){
  for(const a of agents){const dx=Math.abs(wx-a.x),inY=wy>a.y-26&&wy<a.y+3;if(inY&&dx<(a.id==='vianta'?12:9))return a.id}
  for(const tr of trams){const p=trPos(tr);if(p.orient==='h'?(Math.abs(wx-p.x)<18&&wy>p.y-19&&wy<p.y+2):(Math.abs(wx-p.x)<8&&wy>p.y-26&&wy<p.y+1))return tr.id}
  for(const b of [...BL].sort((p,q)=>q.y-p.y)){if(wx>b.ox-2&&wx<b.ox+b.w+2&&wy>b.oy-4&&wy<b.y+3)return b.id}
  return null}
const ptrs=new Map();let drag=null,pinch=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:cam.z};drag=null}
  else drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};camT=null});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];cam.z=Math.min(10,Math.max(fit()*.9,pinch.z*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch.d));return}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>4){drag.moved=true;follow=null;cv.classList.add('dr')}if(drag.moved){cam.x=drag.cx-dx/cam.z;cam.y=drag.cy-dy/cam.z}}
  else{const [wx,wy]=s2w(e.clientX-r.left,e.clientY-r.top);hover=hit(wx,wy);cv.classList.toggle('pt',!!hover);
    if(hover){tip.style.display='block';tip.style.left=(e.clientX-r.left+14)+'px';tip.style.top=(e.clientY-r.top+14)+'px';const R2=REG[hover];tip.innerHTML=R2.t+' <span style="color:#9d93c4">· '+(R2.stl||stLabel[R2.st]||'')+'</span>'}else tip.style.display='none'}});
cv.addEventListener('pointerup',e=>{ptrs.delete(e.pointerId);cv.classList.remove('dr');if(pinch&&ptrs.size<2)pinch=null;
  if(drag&&!drag.moved){const r=cv.getBoundingClientRect();const [wx,wy]=s2w(e.clientX-r.left,e.clientY-r.top);const h=hit(wx,wy);
    if(h){if(e.detail>=2&&canEnter(h)){show(h);enter(h)}else show(h)}else{sel=null;relSet=null}}
  drag=null});
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;const [wx,wy]=s2w(mx,my);
  cam.z=Math.min(10,Math.max(fit()*.9,cam.z*(e.deltaY<0?1.15:.87)));const [wx2,wy2]=s2w(mx,my);cam.x+=wx-wx2;cam.y+=wy-wy2;camT=null},{passive:false});
mini.addEventListener('pointerdown',e=>{const r=mini.getBoundingClientRect();follow=null;camT={x:(e.clientX-r.left)/180*W,y:(e.clientY-r.top)/115*H,z:cam.z}});
window.addEventListener('keydown',e=>{
  if(e.target===q)return;
  if(e.key==='/'||(e.key==='k'&&(e.ctrlKey||e.metaKey))){e.preventDefault();q.focus()}
  else if(e.key==='Escape'){if(room.classList.contains('show'))leave();else{sel=null;relSet=null;follow=null}}
  else if(e.key==='n'||e.key==='N')cycleTime();
  else if(e.key==='f'||e.key==='F')document.getElementById('fit').click();
  else if(e.key===' '){e.preventDefault();const b=document.querySelector(`[data-s="${ts?0:1}"]`);b.click()}});

/* loop */
let last=performance.now(),clkT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  update(dt*ts);
  if(follow&&AGM[follow]&&(!camT||camT.z)){camT={x:AGM[follow].x,y:AGM[follow].y-6,z:camT?camT.z:cam.z}}
  if(camT){const k=Math.min(1,dt*5);cam.x+=(camT.x-cam.x)*k;cam.y+=(camT.y-cam.y)*k;cam.z+=(camT.z-cam.z)*k;if(!follow&&Math.abs(camT.x-cam.x)<.3&&Math.abs(camT.y-cam.y)<.3&&Math.abs(camT.z-cam.z)<.01)camT=null}
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#3a78b8';ctx.fillRect(0,0,cv.width,cv.height);
  const k=dpr*cam.z;ctx.setTransform(k,0,0,k,Math.round(dpr*(cw/2-cam.x*cam.z)),Math.round(dpr*(ch/2-cam.y*cam.z)));
  drawWorld(ctx,t);drawScreen(ctx,t);drawMini();
  clkT-=dt;if(clkT<=0){document.getElementById('clk').textContent='🕒 '+(timeOverride!==null?timeOverride+':00':new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}));clkT=2}
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
/* faixa de estado + auto-refresh */
(function(){const b=document.getElementById('banner');
  if(LIVE){const s=(Date.now()-new Date(LIVE.generated_at))/1000,age=s<3600?Math.floor(s/60)+'min':s<86400?Math.floor(s/3600)+'h':Math.floor(s/86400)+'d',stale=s>1800;
    b.innerHTML=`<b style="color:${stale?'#ff6b81':'#5eead4'}">${stale?'DESATUALIZADO':'LIVE'}</b>Snapshot há ${age}. Carros dos agentes e elétricos = dados reais (1 elétrico = 1 cron). Carros cinzentos = decoração. Movimento simulado, não é tempo real.`}
  else b.innerHTML='<b>OFFLINE</b>Sem snapshot — a mostrar dados de exemplo embutidos.';
  if(LIVE)setInterval(async()=>{try{const r=await fetch('/aios-live/aios-state.json?t='+Date.now());const j=await r.json();if(j.generated_at!==LIVE.generated_at&&!room.classList.contains('show'))location.reload()}catch(e){}},60000)})();
</script>
