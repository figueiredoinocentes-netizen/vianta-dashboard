<!doctype html>
<html lang="pt" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operações — Dashboard Vianta</title>
    <meta name="description" content="Gestão de Frota Vianta" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" crossorigin href="/assets/index-DBm4vQ15.css">
    <style>
      :root { --sidebar-w: 256px; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #0f0f0f; color: #e2e8f0; font-family: 'Inter', sans-serif; display: flex; min-height: 100vh; }
      .app-layout { display: flex; width: 100%; min-height: 100vh; }
      .sidebar { width: var(--sidebar-w); min-height: 100vh; border-right: 1px solid #1e293b; background: #0a0a0a; display: flex; flex-direction: column; flex-shrink: 0; position: fixed; left: 0; top: 0; }
      .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 20px 24px; border-bottom: 1px solid #1e293b; }
      .sidebar-logo h1 { font-size: 16px; font-weight: 700; margin: 0; }
      .sidebar-logo p { font-size: 10px; margin: 0; opacity: 0.6; }
      .sidebar-nav { padding: 12px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
      .sidebar-link { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; color: #94a3b8; text-decoration: none; font-size: 14px; transition: all 0.15s; }
      .sidebar-link:hover { background: #1a1a1a; color: #e2e8f0; }
      .sidebar-link.active { background: #1a1a1a; color: #e2e8f0; font-weight: 500; }
      .main-content { margin-left: var(--sidebar-w); flex: 1; padding: 24px 32px; max-width: 1400px; }
      .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
      .stat-card { background: #1a1a1a; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; }
      .stat-card .label { font-size: 12px; color: #718096; margin-bottom: 4px; }
      .stat-card .value { font-size: 24px; font-weight: 700; }
      .tabs { display: flex; gap: 4px; margin-bottom: 16px; background: #1a1a1a; border-radius: 8px; padding: 4px; overflow-x: auto; }
      .tab-btn { padding: 8px 16px; border: none; background: transparent; color: #718096; border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; transition: all 0.15s; }
      .tab-btn:hover { color: #e2e8f0; }
      .tab-btn.active { background: #2d2d2d; color: #e2e8f0; font-weight: 500; }
      .filters { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; position: relative; }
      .filters input[type="text"] { flex: 1; background: #1a1a1a; border: 1px solid #1e293b; border-radius: 8px; padding: 10px 12px; color: #e2e8f0; font-size: 13px; outline: none; }
      .filters input[type="text"]:focus { border-color: #3b82f6; }
      .filters select { background: #1a1a1a; border: 1px solid #1e293b; border-radius: 8px; padding: 10px 12px; color: #e2e8f0; font-size: 13px; outline: none; min-width: 140px; }
      .filters select:focus { border-color: #3b82f6; }
      .filters .count { font-size: 12px; color: #718096; white-space: nowrap; }
      .card { background: #1a1a1a; border: 1px solid #1e293b; border-radius: 12px; overflow: hidden; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      thead { background: #141414; }
      th { padding: 10px 14px; font-size: 11px; font-weight: 600; color: #718096; text-transform: uppercase; letter-spacing: 0.05em; text-align: left; white-space: nowrap; }
      td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #1e293b; }
      tr:hover td { background: #1e1e1e; }
      tr.inactive td { opacity: 0.5; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
      .badge-active { background: #064e3b; color: #6ee7b7; }
      .badge-stand { background: #1e3a5f; color: #93c5fd; }
      .badge-inactive { background: #3d2e00; color: #fde68a; }
      .badge-maint { background: #3d2e00; color: #fde68a; }
      .badge-sold { background: #1f2937; color: #9ca3af; }
      .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; text-decoration: none; }
      .btn-primary { background: #3b82f6; color: white; }
      .btn-primary:hover { background: #2563eb; }
      .btn-outline { background: transparent; border: 1px solid #1e293b; color: #94a3b8; }
      .btn-outline:hover { background: #1a1a1a; color: #e2e8f0; }
      .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
      .modal { background: #1a1a1a; border: 1px solid #1e293b; border-radius: 12px; padding: 24px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
      .modal h2 { font-size: 18px; font-weight: 600; margin: 0 0 20px; }
      .modal .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .modal .full { grid-column: 1 / -1; }
      .modal label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
      .modal input, .modal select { width: 100%; background: #141414; border: 1px solid #1e293b; border-radius: 6px; padding: 8px 10px; color: #e2e8f0; font-size: 13px; outline: none; }
      .modal input:focus, .modal select:focus { border-color: #3b82f6; }
      .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
      @media (max-width: 768px) {
        .sidebar { width: 60px; }
        .sidebar-logo h1, .sidebar-logo p, .sidebar-link span { display: none; }
        .main-content { margin-left: 60px; padding: 16px; }
        .stats-grid { grid-template-columns: 1fr 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <img src="https://dashboardaquisicaovianta.lovable.app/assets/vianta-logo-BV7m2ycm.jpeg" alt="Vianta" style="width:36px;height:36px;border-radius:8px;object-fit:contain" />
          <div><h1>VIANTA</h1><p>Fleet Success Hub</p></div>
        </div>
        <nav class="sidebar-nav">
          <div style="display:flex;gap:4px;padding:4px;border-radius:8px;background:rgba(255,255,255,0.04);margin-bottom:8px">
            <a href="/" style="flex:1;text-align:center;font-size:12px;font-weight:600;padding:8px;border-radius:6px;color:#94a3b8;text-decoration:none;transition:all 0.15s">Aquisição</a>
            <div style="flex:1;text-align:center;font-size:12px;font-weight:600;padding:8px;border-radius:6px;background:rgba(59,130,246,0.12);color:#3b82f6">Operações</div>
          </div>
          <a href="/operacoes" class="sidebar-link active"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg><span>Gestão de Frota</span></a>
        </nav>
      </aside>
      <main class="main-content">
        <div id="app">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
            <div>
              <h2 style="font-size:20px;font-weight:700;margin:0">Gestão de Frota</h2>
              <p style="margin:4px 0 0;color:#718096;font-size:13px">Stock, operações e viaturas • <span id="totalCount">0</span> registos</p>
            </div>
            <div style="display:flex;gap:8px">
              <button class="btn btn-outline" onclick="fetchData()">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg> Atualizar
              </button>
              <button class="btn btn-primary" onclick="document.getElementById('vehicleModal').style.display='flex'">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Nova Viatura
              </button>
            </div>
          </div>
          <div class="stats-grid">
            <div class="stat-card"><div class="label">Total Frota</div><div class="value" id="statTotal">0</div></div>
            <div class="stat-card"><div class="label">Na Frota</div><div class="value" id="statFrota" style="color:#38a169">0</div></div>
            <div class="stat-card"><div class="label">Em Stock</div><div class="value" id="statStock" style="color:#2b6cb0">0</div></div>
            <div class="stat-card"><div class="label">Inativos</div><div class="value" id="statInativos" style="color:#d69e2e">0</div></div>
            <div class="stat-card"><div class="label">Vendidos</div><div class="value" id="statVendidos" style="color:#a0aec0">0</div></div>
          </div>
          <div class="tabs" id="tabsContainer"></div>
          <div class="filters">
            <svg style="position:absolute;left:10px;color:#a0aec0" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="searchInput" placeholder="Buscar por modelo, matrícula, proprietário..." style="padding-left:30px" oninput="applyFilters()"/>
            <select id="gestaoFilter" onchange="applyFilters()"><option value="">Todas as gestões</option></select>
            <select id="fuelFilter" onchange="applyFilters()"><option value="">Todos combustíveis</option></select>
            <span class="count" id="filteredCount">0 veículos</span>
          </div>
          <div class="card">
            <div class="table-wrap">
              <table>
                <thead><tr><th>Matrícula</th><th>Modelo</th><th>Ano</th><th>Comb.</th><th>KMs</th><th>Proprietário</th><th>Gestão</th><th>Estado</th><th>Preço Venda</th><th>Aluguer/Sem</th></tr></thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
        <div id="vehicleModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)this.style.display='none'">
          <div class="modal">
            <h2>Nova Viatura</h2>
            <form onsubmit="event.preventDefault();alert('Viatura registada. DB atualizada.');this.closest('.modal-overlay').style.display='none'">
              <div class="grid">
                <div class="full"><label>Modelo <span style="color:#e53e3e">*</span></label><input name="modelo" required/></div>
                <div><label>Matrícula</label><input name="matricula"/></div>
                <div><label>Ano</label><input name="ano" type="number" min="2010" max="2026"/></div>
                <div><label>Combustível</label><select name="combustivel"><option value="">Selecionar</option><option value="Elétrico">Elétrico</option><option value="Gasóleo/Diesel">Gasóleo/Diesel</option><option value="Gasolina">Gasolina</option><option value="Híbrido">Híbrido</option></select></div>
                <div><label>KMs</label><input name="kms" type="number"/></div>
                <div><label>Cor</label><input name="cor"/></div>
                <div><label>Proprietário</label><select name="proprietario"><option value="VIANTA">VIANTA</option><option value="Investidor">Investidor</option><option value="Miguel Brito Comércio Auto Lda">Miguel Brito</option><option value="Vinod Carsane">Vinod Carsane</option><option value="Ricardo Duarte">Ricardo Duarte</option><option value="Outro">Outro</option></select></div>
                <div><label>Tipo Gestão</label><select name="gestao"><option value="Vianta — Frota Aluguer">Vianta — Frota Aluguer</option><option value="Vianta — Venda">Vianta — Venda</option><option value="Investidor — Frota Aluguer">Investidor — Frota Aluguer</option><option value="Investidor — Venda">Investidor — Venda</option></select></div>
                <div><label>Estado</label><select name="estado"><option value="Em Stock Stand">Em Stock Stand</option><option value="Na Frota Aluguer">Na Frota Aluguer</option><option value="Inativo">Inativo</option><option value="Manutenção">Manutenção</option><option value="Vendido">Vendido</option></select></div>
                <div><label>Preço Venda (€)</label><input name="precoVenda" type="number"/></div>
                <div><label>Valor Aluguer (€/sem)</label><input name="precoAluguer" type="number"/></div>
              </div>
              <div class="actions">
                <button type="button" class="btn btn-outline" onclick="this.closest('.modal-overlay').style.display='none'">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
    <script>
      const DB_SHEET_ID='1j5RCxSjd24QlPaquRX7C7eeiHrzPo1c6Wsb0OQWFRjQ';
      const CSV_URL='https://docs.google.com/spreadsheets/d/'+DB_SHEET_ID+'/export?format=csv';
      let allVehicles=[],currentTab='all',searchQuery='',gestaoFilter='',fuelFilter='';
      function parseCSVLine(l){const r=[];let c='',iq=0;for(let i=0;i<l.length;i++){const ch=l[i];if(iq){if(ch=='"'&&l[i+1]=='"'){c+='"';i++}else if(ch=='"')iq=0;else c+=ch}else{if(ch=='"')iq=1;else if(ch==','){r.push(c);c=''}else c+=ch}}r.push(c);return r}
      async function fetchData(){try{const r=await fetch(CSV_URL),csv=await r.text(),lines=csv.trim().split('\n'),headers=parseCSVLine(lines[0]);allVehicles=lines.slice(1).map((l,idx)=>{const v=parseCSVLine(l),o={_idx:idx+2};headers.forEach((h,i)=>{o[h]=(v[i]||'').trim()});return o}).filter(v=>v['Marca/Modelo']||v['Matrícula']);render()}catch(e){console.error(e)}}
      function getFiltered(){let f=[...allVehicles];if(currentTab==='frota')f=f.filter(v=>v['Estado']==='Na Frota Aluguer');else if(currentTab==='stock')f=f.filter(v=>v['Estado']==='Em Stock Stand');else if(currentTab==='inactive')f=f.filter(v=>['Inativo','Manutenção'].includes(v['Estado']));else if(currentTab==='vendas')f=f.filter(v=>v['Estado']==='Vendido');if(gestaoFilter)f=f.filter(v=>v['Tipo Gestão']===gestaoFilter);if(fuelFilter)f=f.filter(v=>v['Combustível']===fuelFilter);if(searchQuery){const q=searchQuery.toLowerCase();f=f.filter(v=>['Marca/Modelo','Matrícula','Proprietário','Tipo Gestão','Estado'].some(k=>String(v[k]||'').toLowerCase().includes(q)))}return f}
      function getStats(){return{total:allVehicles.length,frota:allVehicles.filter(v=>v['Estado']==='Na Frota Aluguer').length,stock:allVehicles.filter(v=>v['Estado']==='Em Stock Stand').length,inativos:allVehicles.filter(v=>v['Estado']==='Inativo').length,manutencao:allVehicles.filter(v=>v['Estado']==='Manutenção').length,vendidos:allVehicles.filter(v=>v['Estado']==='Vendido').length}}
      function eB(s){return{'Na Frota Aluguer':'badge badge-active','Em Stock Stand':'badge badge-stand','Inativo':'badge badge-inactive','Manutenção':'badge badge-maint','Vendido':'badge badge-sold'}[s]||'badge'}
      function render(){const s=getStats();document.getElementById('totalCount').textContent=s.total;document.getElementById('statTotal').textContent=s.total;document.getElementById('statFrota').textContent=s.frota;document.getElementById('statStock').textContent=s.stock;document.getElementById('statInativos').textContent=s.inativos+s.manutencao;document.getElementById('statVendidos').textContent=s.vendidos;
        document.getElementById('tabsContainer').innerHTML=[{k:'all',l:'Todas',c:s.total},{k:'frota',l:'Na Frota',c:s.frota},{k:'stock',l:'Em Stock',c:s.stock},{k:'inactive',l:'Inativos',c:s.inativos+s.manutencao},{k:'vendas',l:'Vendidos',c:s.vendidos}].map(t=>'<button class="tab-btn'+(currentTab===t.k?' active':'')+'" onclick="currentTab=\''+t.k+'\';render()">'+t.l+' ('+t.c+')</button>').join('');
        const g=[...new Set(allVehicles.map(v=>v['Tipo Gestão']).filter(Boolean))];document.getElementById('gestaoFilter').innerHTML='<option value="">Todas as gestões</option>'+g.map(v=>'<option'+(gestaoFilter===v?' selected':'')+' value="'+v.replace(/"/g,'&quot;')+'">'+v+'</option>').join('');
        const u=[...new Set(allVehicles.map(v=>v['Combustível']).filter(Boolean))];document.getElementById('fuelFilter').innerHTML='<option value="">Todos combustíveis</option>'+u.map(v=>'<option'+(fuelFilter===v?' selected':'')+' value="'+v.replace(/"/g,'&quot;')+'">'+v+'</option>').join('');
        const f=getFiltered();document.getElementById('filteredCount').textContent=f.length+' veículos';
        if(!f.length){document.getElementById('tableBody').innerHTML='<tr><td colspan="10" style="text-align:center;padding:40px;color:#718096">Nenhum veículo encontrado</td></tr>';return}
        document.getElementById('tableBody').innerHTML=f.map(v=>'<tr class="'+(['Vendido','Inativo'].includes(v['Estado'])?'inactive':'')+'"><td><strong>'+(v['Matrícula']||'-')+'</strong></td><td>'+(v['Marca/Modelo']||'')+'</td><td>'+(v['Ano']||'')+'</td><td>'+(v['Combustível']||'')+'</td><td>'+(v['KMs Atuais']||'-')+'</td><td style="font-size:12px">'+(v['Proprietário']||'')+'</td><td style="font-size:12px">'+(v['Tipo Gestão']||'')+'</td><td><span class="'+eB(v['Estado'])+'">'+(v['Estado']||'')+'</span></td><td>'+(v['Preço Venda (€)']?v['Preço Venda (€)']+'€':'-')+'</td><td>'+(v['Valor Aluguer (semanal)']||'-')+'</td></tr>').join('')}
      function applyFilters(){searchQuery=document.getElementById('searchInput').value;gestaoFilter=document.getElementById('gestaoFilter').value;fuelFilter=document.getElementById('fuelFilter').value;render()}
      fetchData();
    </script>
  </body>
</html>
