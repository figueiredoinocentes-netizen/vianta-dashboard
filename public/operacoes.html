<!doctype html>
<html lang="pt" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operações — Dashboard Vianta</title>
    <meta name="description" content="Gestão de Frota Vianta" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" crossorigin href="/assets/index-DBm4vQ15.css" />
    <style>
      :root {
        --sidebar-w: 256px;
        --bg: #0e1115;
        --sidebar-bg: #101318;
        --card-bg: #14181f;
        --border: #23272f;
        --muted-bg: #1e2229;
        --muted-fg: #7b899d;
        --fg: #f1f5f9;
        --primary: #f4af25;
        --primary-hover: #dba01f;
        --primary-fg: #211c12;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'Inter', sans-serif; display: flex; min-height: 100vh; }
      .app-layout { display: flex; width: 100%; min-height: 100vh; }
      .sidebar { width: var(--sidebar-w); min-height: 100vh; border-right: 1px solid var(--border); background: var(--sidebar-bg); display: flex; flex-direction: column; flex-shrink: 0; position: fixed; left: 0; top: 0; }
      .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 20px 24px; border-bottom: 1px solid var(--border); }
      .sidebar-logo h1 { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; margin: 0; }
      .sidebar-logo p { font-size: 10px; margin: 0; opacity: 0.6; }
      .sidebar-nav { padding: 12px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
      .sidebar-link { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; color: var(--muted-fg); text-decoration: none; font-size: 14px; transition: all 0.15s; }
      .sidebar-link:hover { background: var(--muted-bg); color: var(--fg); }
      .sidebar-link.active { background: var(--muted-bg); color: var(--fg); font-weight: 500; }
      .sidebar-section-title { padding: 12px 16px 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #475569; font-weight: 600; }
      .sidebar-sublink { display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 28px; border-radius: 6px; color: var(--muted-fg); text-decoration: none; font-size: 13px; cursor: pointer; transition: all 0.15s; border: none; background: transparent; width: 100%; text-align: left; }
      .sidebar-sublink:hover { background: var(--muted-bg); color: var(--fg); }
      .sidebar-sublink.active { background: rgba(244,175,37,0.12); color: var(--primary); font-weight: 500; }
      .main-content { margin-left: var(--sidebar-w); flex: 1; padding: 24px 32px; max-width: 1400px; }
      .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
      .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
      .stat-card .label { font-size: 12px; color: var(--muted-fg); margin-bottom: 4px; }
      .stat-card .value { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; }
      .section-tabs { display: flex; gap: 4px; margin-bottom: 12px; background: var(--card-bg); border-radius: 8px; padding: 4px; overflow-x: auto; flex-wrap: nowrap; }
      .section-btn { padding: 8px 14px; border: none; background: transparent; color: var(--muted-fg); border-radius: 6px; cursor: pointer; font-size: 12px; white-space: nowrap; transition: all 0.15s; }
      .section-btn:hover { color: var(--fg); background: var(--muted-bg); }
      .section-btn.active { background: rgba(244,175,37,0.12); color: var(--primary); font-weight: 600; }
      .filters { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; position: relative; }
      .filters input[type="text"] { flex: 1; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--fg); font-size: 13px; outline: none; }
      .filters input[type="text"]:focus { border-color: var(--primary); }
      .filters select { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--fg); font-size: 13px; outline: none; min-width: 140px; }
      .filters select:focus { border-color: var(--primary); }
      .filters .count { font-size: 12px; color: var(--muted-fg); white-space: nowrap; }
      .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      thead { background: var(--sidebar-bg); }
      th { padding: 10px 14px; font-size: 11px; font-weight: 600; color: var(--muted-fg); text-transform: uppercase; letter-spacing: 0.05em; text-align: left; white-space: nowrap; }
      td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--border); }
      tr:hover td { background: var(--muted-bg); }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
      .badge-alugado { background: #064e3b; color: #6ee7b7; }
      .badge-venda { background: #1e3a5f; color: #93c5fd; }
      .badge-inativo { background: #3d2e00; color: #fde68a; }
      .badge-maint { background: #78350f; color: #fbbf24; }
      .badge-vendido { background: #1f2937; color: #9ca3af; }
      .badge-prep { background: #312e81; color: #a5b4fc; }
      .badge-aluguer { background: #14532d; color: #86efac; }
      .status-badge { cursor: pointer; transition: filter 0.15s; }
      .status-badge:hover { filter: brightness(1.2); }
      .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; text-decoration: none; }
      .btn-primary { background: var(--primary); color: var(--primary-fg); }
      .btn-primary:hover { background: var(--primary-hover); }
      .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted-fg); }
      .btn-outline:hover { background: var(--muted-bg); color: var(--fg); }
      .btn-danger { background: #dc2626; color: white; }
      .btn-danger:hover { background: #b91c1c; }
      .btn-sm { padding: 4px 10px; font-size: 11px; }
      .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
      .modal { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
      .modal h2 { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600; margin: 0 0 20px; }
      .modal .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .modal .full { grid-column: 1 / -1; }
      .modal label { display: block; font-size: 13px; color: var(--muted-fg); margin-bottom: 4px; }
      .modal input, .modal select { width: 100%; background: var(--sidebar-bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: var(--fg); font-size: 13px; outline: none; }
      .modal input:focus, .modal select:focus { border-color: var(--primary); }
      .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
      .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
      .kpi-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
      .kpi-card .val { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; }
      .kpi-card .sub { font-size: 11px; color: var(--muted-fg); margin-top: 2px; }
      .low-stock { color: #ef4444; }
      .warning-stock { color: #f59e0b; }
      .ok-stock { color: #22c55e; }
      .vehicle-cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
      .vehicle-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
      .vehicle-card-img { width: 100%; height: 140px; background: var(--sidebar-bg); display: flex; align-items: center; justify-content: center; overflow: hidden; }
      .vehicle-card-img img { width: 100%; height: 100%; object-fit: cover; }
      .vehicle-card-img svg { opacity: 0.25; }
      .vehicle-card-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
      .vehicle-card-title { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; }
      .vehicle-card-plate { font-size: 12px; color: var(--muted-fg); margin-top: -4px; }
      .missing-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
      .missing-tag { background: var(--muted-bg); color: #fbbf24; border: 1px solid var(--border); border-radius: 5px; padding: 3px 8px; font-size: 11px; cursor: pointer; transition: all 0.15s; }
      .missing-tag:hover { background: #3d2e00; border-color: #fbbf24; }
      .missing-none { font-size: 12px; color: #22c55e; }
      .vehicle-card-actions { margin-top: auto; padding-top: 8px; }
      @media (max-width: 768px) {
        .sidebar { width: 60px; }
        .sidebar-logo h1, .sidebar-logo p, .sidebar-link span { display: none; }
        .sidebar-sublink span { display: none; }
        .main-content { margin-left: 60px; padding: 16px; }
        .stats-grid { grid-template-columns: 1fr 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <img src="https://dashboardaquisicaovianta.lovable.app/assets/vianta-logo-BV7m2ycm.jpeg" alt="Vianta" style="width:36px;height:36px;border-radius:8px;object-fit:contain" />
          <div><h1>CENTRAL VIANTA</h1><p>Gestão de Frota</p></div>
        </div>
        <nav class="sidebar-nav">
          <div style="display:flex;gap:4px;padding:4px;border-radius:8px;background:rgba(255,255,255,0.04);margin-bottom:8px">
            <a href="/" style="flex:1;text-align:center;font-size:12px;font-weight:600;padding:8px;border-radius:6px;color:#7b899d;text-decoration:none;transition:all 0.15s">Aquisição</a>
            <div style="flex:1;text-align:center;font-size:12px;font-weight:600;padding:8px;border-radius:6px;background:rgba(244,175,37,0.12);color:#f4af25">Operações</div>
          </div>
          <a href="/operacoes" class="sidebar-link"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg><span>Gestão de Frota</span></a>
          <button class="sidebar-sublink" data-section="visao" onclick="setSection('visao')">📊 Visão Geral</button>
          <button class="sidebar-sublink" data-section="frota" onclick="setSection('frota')">🚗 Frota Ativa</button>
          <button class="sidebar-sublink" data-section="stock" onclick="setSection('stock')">🏪 Stock</button>
          <button class="sidebar-sublink" data-section="manutencao" onclick="setSection('manutencao')">🔧 Manutenções</button>
          <button class="sidebar-sublink active" data-section="checkin" onclick="setSection('checkin')">✅ Check-ins</button>
          <button class="sidebar-sublink" data-section="pagamentos" onclick="setSection('pagamentos')">💰 Pagamentos</button>
          <button class="sidebar-sublink" data-section="armazem" onclick="setSection('armazem')">📦 Armazém</button>
        </nav>
      </aside>
      <main class="main-content">
        <div id="app">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <div>
              <h2 style="font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;margin:0">Gestão de Frota</h2>
              <p style="margin:4px 0 0;color:#7b899d;font-size:13px"><span id="sectionLabel">Check-ins</span> • <span id="totalCount">0</span> registos</p>
            </div>
            <div style="display:flex;gap:8px">
              <button class="btn btn-outline" onclick="fetchData()">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg> Atualizar
              </button>
              <button class="btn btn-primary" id="newBtn" onclick="document.getElementById('vehicleModal').style.display='flex'">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg> <span id="newBtnLabel">Nova Viatura</span>
              </button>
            </div>
          </div>
          <div id="sectionContent"></div>
        </div>
        <div id="vehicleModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)this.style.display='none'">
          <div class="modal">
            <h2>Nova Viatura</h2>
            <form onsubmit="handleNovaViatura(event)">
              <div class="grid">
                <div class="full"><label>Modelo <span style="color:#e53e3e">*</span></label><input name="modelo" required/></div>
                <div class="full"><label>Foto</label><input name="foto" type="file" accept="image/*"/></div>
                <div><label>Matrícula</label><input name="matricula"/></div>
                <div><label>Ano</label><input name="ano" type="number" min="2010" max="2026"/></div>
                <div><label>Combustível</label><select name="combustivel"><option value="">Selecionar</option><option value="Elétrico">Elétrico</option><option value="Gasóleo/Diesel">Gasóleo/Diesel</option><option value="Gasolina">Gasolina</option><option value="Híbrido">Híbrido</option></select></div>
                <div><label>KMs</label><input name="kms" type="number"/></div>
                <div><label>Cor</label><input name="cor"/></div>
                <div><label>Proprietário</label><select name="proprietario"><option value="VIANTA">VIANTA</option><option value="Investidor">Investidor</option><option value="Miguel Brito Comércio Auto Lda">Miguel Brito</option><option value="Vinod Carsane">Vinod Carsane</option><option value="Ricardo Duarte">Ricardo Duarte</option><option value="EMPRESA">EMPRESA</option><option value="Outro">Outro</option></select></div>
                <div><label>Tipo Gestão</label><select name="gestao"><option value="Aluguer">Aluguer</option><option value="Venda">Venda</option><option value="Slot">Slot</option></select></div>
                <div><label>Estado</label><select name="estado"><option value="Em Preparação" selected>Em Preparação</option><option value="Alugado">Alugado</option><option value="Para Venda">Para Venda</option><option value="Para Aluguer">Para Aluguer</option><option value="Inativo">Inativo</option><option value="Manutenção">Manutenção</option><option value="Vendido">Vendido</option></select></div>
                <div><label>Preço Venda (€)</label><input name="precoVenda" type="number"/></div>
                <div><label>Valor Aluguer (€/sem)</label><input name="precoAluguer" type="number"/></div>
              </div>
              <div class="actions">
                <button type="button" class="btn btn-outline" onclick="this.closest('.modal-overlay').style.display='none'">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
              </div>
            </form>
          </div>
        </div>
        <div id="armazemModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)this.style.display='none'">
          <div class="modal">
            <h2>Novo Item</h2>
            <form onsubmit="handleNovoItem(event)">
              <div class="grid">
                <div class="full"><label>Item <span style="color:#e53e3e">*</span></label><input name="item" required/></div>
                <div><label>Categoria</label><select name="categoria"><option value="Lubrificantes">Lubrificantes</option><option value="Filtros">Filtros</option><option value="Travões">Travões</option><option value="Pneus">Pneus</option><option value="Fluidos">Fluidos</option><option value="Documentação">Documentação</option><option value="Segurança">Segurança</option><option value="Limpeza">Limpeza</option><option value="Outro">Outro</option></select></div>
                <div><label>Stock Atual</label><input name="stock" type="number"/></div>
                <div><label>Stock Mínimo</label><input name="minimo" type="number"/></div>
                <div><label>Unidade</label><input name="unidade"/></div>
                <div><label>Fornecedor</label><input name="fornecedor"/></div>
              </div>
              <div class="actions">
                <button type="button" class="btn btn-outline" onclick="this.closest('.modal-overlay').style.display='none'">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
    <script>
      let allVehicles=[],inventory=[],motoristasMap={},currentSection='checkin';

      // Checklist de preparação — Instrução de Trabalho "Preparação de Viatura STAND".
      // Aluguer ainda não tem checklist própria definida (fica vazia por agora).
      const CHECKLIST_VENDA=[
        'DUA ou DAV','Declaração de Circulação','Validar Seguro com o cliente','Inspeção',
        'Livros de Manutenção e Manual de Utilizador','Garantia','2ª chave (quando aplicável)',
        'Pneu suplente ou kit furos','Triângulo e colete','Cabo de carregador (aplicável a BEV)',
        'Pintura','Pneus','Mecânica (óleo, refrigerante, limpa para-brisas, bateria 12v)',
        'Carga elétrica (aplicável a BEV)','Limpeza exterior e interior',
      ];
      const CHECKLIST_ALUGUER=[];
      function getChecklist(v){return v.tipo_gestao==='Venda'?CHECKLIST_VENDA:(v.tipo_gestao==='Aluguer'?CHECKLIST_ALUGUER:[]);}
      function getMissingItems(v){const done=v.checklist_prep||{};return getChecklist(v).filter(item=>!done[item]);}

      const SECTIONS=[
        {id:'visao',label:'📊 Visão Geral'},
        {id:'frota',label:'🚗 Frota Ativa'},
        {id:'stock',label:'🏪 Stock'},
        {id:'manutencao',label:'🔧 Manutenções'},
        {id:'checkin',label:'✅ Check-ins'},
        {id:'pagamentos',label:'💰 Pagamentos'},
        {id:'armazem',label:'📦 Armazém'},
      ];

      const BADGE_MAP={'Alugado':'badge-alugado','Para Venda':'badge-venda','Inativo':'badge-inativo','Manutenção':'badge-maint','Vendido':'badge-vendido','Em Preparação':'badge-prep','Para Aluguer':'badge-aluguer'};
      const STATUSES=['Alugado','Para Venda','Para Aluguer','Em Preparação','Inativo','Manutenção','Vendido'];

      async function fetchData(){
        try{
          const [carrosRes,armazemRes,motoristasRes]=await Promise.all([
            fetch('/.netlify/functions/central?type=carros'),
            fetch('/.netlify/functions/central?type=armazem'),
            fetch('/.netlify/functions/central?type=motoristas'),
          ]);
          allVehicles=carrosRes.ok?await carrosRes.json():[];
          inventory=armazemRes.ok?await armazemRes.json():[];
          motoristasMap={};
          if(motoristasRes.ok){(await motoristasRes.json()).forEach(m=>{motoristasMap[m.id]=m});}
          render();
        }catch(e){console.error(e)}
      }

      function setSection(id){
        currentSection=id;
        document.getElementById('sectionLabel').textContent=SECTIONS.find(s=>s.id===id).label;
        document.querySelectorAll('.sidebar-sublink').forEach(b=>b.classList.toggle('active',b.dataset.section===id));
        render();
      }

      function render(){
        const fn={'visao':renderVisao,'frota':renderFrota,'stock':renderStock,'manutencao':renderManutencao,'checkin':renderCheckin,'pagamentos':renderPagamentos,'armazem':renderArmazem};
        const view=fn[currentSection]||renderVisao;
        view();
      }

      // ── Visão Geral ──
      function renderVisao(){
        const s=getStats();
        const alugados=allVehicles.filter(v=>v.estado==='Alugado'&&v.tipo_gestao!=='Slot');
        const totalRenda=alugados.reduce((sum,v)=>{const p=parseFloat(String(v.valor_aluguer_semanal||'0').replace(/[^\d.,]/g,''));return sum+(isNaN(p)?0:p*4.33)},0);
        document.getElementById('totalCount').textContent=s.total;
        document.getElementById('sectionContent').innerHTML='<div class="kpi-grid">'+
          '<div class="kpi-card"><div class="val" style="color:#6ee7b7">'+alugados.length+'</div><div class="label">🚗 Frota Ativa</div><div class="sub">Alugados na rua</div></div>'+
          '<div class="kpi-card"><div class="val" style="color:#93c5fd">'+s.stock+'</div><div class="label">🏪 Em Stock</div><div class="sub">Para venda / aluguer</div></div>'+
          '<div class="kpi-card"><div class="val" style="color:#fbbf24">'+(s.inativos+s.manutencao)+'</div><div class="label">🔧 Parados</div><div class="sub">Inativo + Manutenção</div></div>'+
          '<div class="kpi-card"><div class="val" style="color:#9ca3af">'+s.vendidos+'</div><div class="label">💰 Vendidos</div><div class="sub">Este ano</div></div>'+
          '<div class="kpi-card"><div class="val" style="color:#22c55e">€'+Math.round(totalRenda).toLocaleString()+'</div><div class="label">📈 Receita Aluguer/mês</div><div class="sub">Estimada ('+alugados.length+' alugados)</div></div>'+
          '<div class="kpi-card"><div class="val" style="color:#60a5fa">'+s.total+'</div><div class="label">Total Frota</div><div class="sub">Todas as viaturas</div></div>'+
        '</div><div class="stats-grid">'+
          '<div class="stat-card"><div class="label">Proprietário VIANTA</div><div class="value">'+allVehicles.filter(v=>v.proprietario==='VIANTA').length+'</div></div>'+
          '<div class="stat-card"><div class="label">Investidores</div><div class="value">'+allVehicles.filter(v=>v.proprietario&&v.proprietario!=='VIANTA'&&v.tipo_gestao!=='Slot').length+'</div></div>'+
          '<div class="stat-card"><div class="label">Slot</div><div class="value">'+allVehicles.filter(v=>v.tipo_gestao==='Slot').length+'</div></div>'+
        '</div>';
      }

      // ── Frota Ativa ──
      function renderFrota(){
        const f=allVehicles.filter(v=>v.estado==='Alugado'&&v.tipo_gestao!=='Slot');
        document.getElementById('totalCount').textContent=f.length;

      // ── Check-ins ──
      const CAR_PLACEHOLDER_SVG='<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 17h14M5 17a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm14 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM5 17l1.5-6.5A2 2 0 0 1 8.42 9h7.16a2 2 0 0 1 1.92 1.5L19 17M5 17V13m14 4V13M5 13h14"/></svg>';

      function renderCheckin(){
        const f=allVehicles.filter(v=>v.estado==='Em Preparação');
        document.getElementById('totalCount').textContent=f.length;
        document.getElementById('newBtnLabel').textContent='Nova Viatura';
        document.getElementById('newBtn').setAttribute('onclick',"document.getElementById('vehicleModal').style.display='flex'");
        if(!f.length){
          document.getElementById('sectionContent').innerHTML='<div class="card" style="padding:40px;text-align:center;color:#7b899d">Nenhuma viatura em preparação</div>';
          return;
        }
        let html='<div class="vehicle-cards-grid">';
        f.forEach(v=>{
          const missing=getMissingItems(v);
          const destino=v.tipo_gestao==='Aluguer'?'Para Aluguer':'Para Venda';
          html+='<div class="vehicle-card">'+
            '<div class="vehicle-card-img">'+(v.foto_url?'<img src="'+v.foto_url+'" alt=""/>':CAR_PLACEHOLDER_SVG)+'</div>'+
            '<div class="vehicle-card-body">'+
              '<div><div class="vehicle-card-title">'+(v.marca_modelo||'Sem modelo')+'</div><div class="vehicle-card-plate">'+(v.matricula||'Sem matrícula')+' • '+(v.tipo_gestao||'-')+'</div></div>'+
              (missing.length
                ? '<div class="missing-list">'+missing.map(item=>'<span class="missing-tag" title="Clique para marcar como feito" onclick="toggleChecklistItem('+v.id+',\''+item.replace(/'/g,"\\'")+'\')">'+item+'</span>').join('')+'</div>'
                : (getChecklist(v).length ? '<div class="missing-none">✓ Checklist completa</div>' : '<div class="missing-none" style="color:#7b899d">Sem checklist definida para '+(v.tipo_gestao||'este tipo')+'</div>')
              )+
              '<div class="vehicle-card-actions"><button class="btn btn-sm btn-primary" onclick="setStatus('+v.id+',\''+destino+'\')">Concluir Preparação</button></div>'+
            '</div>'+
          '</div>';
        });
        html+='</div>';
        document.getElementById('sectionContent').innerHTML=html;
      }

      async function toggleChecklistItem(carId,item){
        const v=allVehicles.find(x=>x.id===carId);
        if(!v)return;
        const done={...(v.checklist_prep||{})};
        done[item]=!done[item];
        await updateCell(v,'checklist_prep',done);
      }

      // ── Pagamentos ──
      async function renderPagamentos(){
        document.getElementById('newBtnLabel').textContent='Nova Viatura';
        document.getElementById('newBtn').setAttribute('onclick',"document.getElementById('vehicleModal').style.display='flex'");
        try{
          const r=await fetch('/.netlify/functions/central?type=pagamentos',{headers:{'Accept':'application/json'}});
          if(!r.ok){throw new Error('API error');}
          const data=await r.json();
          document.getElementById('totalCount').textContent=data.length;
          if(!data.length){
            document.getElementById('sectionContent').innerHTML='<div class="card" style="padding:40px;text-align:center;color:#7b899d">Sem pagamentos registados</div>';
            return;
          }
          let html='<div class="card"><div class="table-wrap"><table><thead><tr><th>Motorista</th><th>Email</th><th>Tipo</th><th>Total Bruto</th><th>Aluguer</th><th>Taxa Admin</th><th>IVA</th><th>Líquido</th><th>Estado</th><th>Data Pagamento</th></tr></thead><tbody>';
          data.forEach(p=>{
            const mot=motoristasMap[p.motorista_id];
            const nome=mot?mot.nome:('#'+(p.motorista_id||'?'));
            const email=mot?(mot.email||''):'';
            const estadoClass=p.estado==='Pago'?'badge-alugado':(p.estado==='Pendente'?'badge-inativo':'badge-maint');
            html+='<tr><td><strong>'+nome+'</strong></td><td style="font-size:12px">'+email+'</td><td>'+(mot?mot.tipo||'':'')+'</td><td>€'+(p.total_bruto||'0')+'</td><td>€'+(p.aluguer||'0')+'</td><td>€'+(p.taxa_admin||'0')+'</td><td>€'+(p.iva||'0')+'</td><td><strong>€'+(p.liquidio||'0')+'</strong></td><td><span class="badge '+estadoClass+'">'+(p.estado||'')+'</span></td><td>'+(p.data_pagamento||'')+'</td></tr>';
          });

          document.getElementById('sectionContent').innerHTML=html;
        }catch(e){
          document.getElementById('sectionContent').innerHTML='<div class="card" style="padding:40px;text-align:center;color:#ef4444">Erro ao carregar pagamentos: '+e.message+'</div>';

      // ── Armazém ──
      function renderArmazem(){
        document.getElementById('totalCount').textContent=inventory.length;
        document.getElementById('newBtnLabel').textContent='Novo Item';
        document.getElementById('newBtn').setAttribute('onclick',"document.getElementById('armazemModal').style.display='flex'");
        if(!inventory.length){
          document.getElementById('sectionContent').innerHTML='<div class="card" style="padding:40px;text-align:center;color:#7b899d">Nenhum item no armazém</div>';
          return;
        }
        let html='<div class="card"><div class="table-wrap"><table><thead><tr><th>Item</th><th>Categoria</th><th>Stock</th><th>Mínimo</th><th>Unidade</th><th>Fornecedor</th><th>Última Compra</th></tr></thead><tbody>';
        inventory.forEach(v=>{
          const stock=parseInt(v.stock_atual||'0');
          const minimo=parseInt(v.stock_minimo||'0');
          const statusClass=stock<minimo?'low-stock':(stock<=minimo?'warning-stock':'ok-stock');
          html+='<tr><td><strong>'+(v.item||'')+'</strong></td><td>'+(v.categoria||'')+'</td><td class="'+statusClass+'"><strong>'+(v.stock_atual??'0')+'</strong></td><td>'+(v.stock_minimo??'0')+'</td><td>'+(v.unidade||'')+'</td><td>'+(v.fornecedor||'')+'</td><td>'+(v.ultima_compra||'')+'</td></tr>';
        });
        html+='</tbody></table></div></div>';
        document.getElementById('sectionContent').innerHTML=html;
      }

      // ── Helpers ──
      function getStats(){
        return{
          total:allVehicles.length,
          frota:allVehicles.filter(v=>v.estado==='Alugado'&&v.tipo_gestao!=='Slot').length,
          stock:allVehicles.filter(v=>(v.estado==='Para Venda'||v.estado==='Para Aluguer')&&v.tipo_gestao!=='Slot').length,
          inativos:allVehicles.filter(v=>v.estado==='Inativo').length,
          manutencao:allVehicles.filter(v=>v.estado==='Manutenção').length,
          vendidos:allVehicles.filter(v=>v.estado==='Vendido').length,
          preparacao:allVehicles.filter(v=>v.estado==='Em Preparação').length,
        };
      }

      async function setStatus(rowId,newStatus){
        const v=allVehicles.find(x=>x.id===rowId);
        if(!v)return;
        await updateCell(v,'estado',newStatus);
      }

      async function updateCell(v,field,value){
        try{
          const r=await fetch('/.netlify/functions/central?type=carros',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:v.id,field,value})});
          const d=await r.json().catch(()=>({}));
          if(r.ok){v[field]=value;render();return true}
          else{alert('Erro: '+(d.error||'falha ao guardar'));return false}
        }catch(e){alert('Erro ao guardar: '+e.message);return false}
      }

      function editStatus(el,rowId,currentValue){
        if(document.querySelector('.status-edit-select'))return;
        const sel=document.createElement('select');
        sel.className='status-edit-select';
        sel.style.cssText='background:#14181f;border:1px solid #f4af25;border-radius:4px;color:#e2e8f0;font-size:11px;font-weight:500;padding:2px 6px;outline:none;cursor:pointer';
        STATUSES.forEach(s=>{
          const opt=document.createElement('option');
          opt.value=s;opt.textContent=s;
          if(s===currentValue)opt.selected=true;
          sel.appendChild(opt);
        });
        sel.addEventListener('change',async()=>{
          const newVal=sel.value;
          sel.remove();
          if(newVal===currentValue)return;
          const v=allVehicles.find(x=>x.id===rowId);
          if(v)await updateCell(v,'estado',newVal);
        });
        sel.addEventListener('blur',()=>sel.remove());
        el.textContent='';
        el.appendChild(sel);
        sel.focus();
      }

      // Redimensiona a imagem no browser antes de enviar (mantém o payload pequeno).
      function compressImage(file,maxDim,quality){
        return new Promise((resolve,reject)=>{
          const img=new Image();
          const reader=new FileReader();
          reader.onload=()=>{img.onload=()=>{
            let{width,height}=img;
            if(width>height&&width>maxDim){height=Math.round(height*maxDim/width);width=maxDim;}
            else if(height>maxDim){width=Math.round(width*maxDim/height);height=maxDim;}
            const canvas=document.createElement('canvas');
            canvas.width=width;canvas.height=height;
            canvas.getContext('2d').drawImage(img,0,0,width,height);
            resolve(canvas.toDataURL('image/jpeg',quality));
          };img.onerror=reject;img.src=reader.result;};
          reader.onerror=reject;
          reader.readAsDataURL(file);
        });
      }

      async function uploadFoto(file){
        const dataUrl=await compressImage(file,1280,0.75);
        const dataBase64=dataUrl.split(',')[1];
        const r=await fetch('/.netlify/functions/upload-foto',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name,contentType:'image/jpeg',dataBase64})});
        const d=await r.json().catch(()=>({}));
        if(!r.ok)throw new Error(d.error||'Erro ao enviar imagem');
        return d.url;
      }

      async function handleNovaViatura(e){
        e.preventDefault();
        const f=e.target;
        const submitBtn=f.querySelector('button[type=submit]');
        submitBtn.disabled=true;
        try{
          let fotoUrl=null;
          const fotoFile=f.foto.files[0];
          if(fotoFile){
            submitBtn.textContent='A enviar foto...';
            fotoUrl=await uploadFoto(fotoFile);
          }
          const body={
            matricula:f.matricula.value||null,
            marca_modelo:f.modelo.value||null,
            ano:f.ano.value||null,
            combustivel:f.combustivel.value||null,
            kms_atuais:f.kms.value||null,
            proprietario:f.proprietario.value||null,
            tipo_gestao:f.gestao.value||null,
            estado:f.estado.value||null,
            preco_venda:f.precoVenda.value||null,
            valor_aluguer_semanal:f.precoAluguer.value||null,
            foto_url:fotoUrl,
          };
          const r=await fetch('/.netlify/functions/central?type=carros',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
          const d=await r.json().catch(()=>({}));
          if(!r.ok){alert('Erro ao guardar: '+(d.error||r.status));return;}
          f.reset();
          f.closest('.modal-overlay').style.display='none';
          await fetchData();
        }catch(err){
          alert('Erro ao guardar: '+err.message);
        }finally{
          submitBtn.disabled=false;
          submitBtn.textContent='Guardar';
        }
      }

      async function handleNovoItem(e){
        e.preventDefault();
        const f=e.target;
        const body={
          item:f.item.value||null,
          categoria:f.categoria.value||null,
          stock_atual:f.stock.value?Number(f.stock.value):0,
          stock_minimo:f.minimo.value?Number(f.minimo.value):0,
          unidade:f.unidade.value||null,
          fornecedor:f.fornecedor.value||null,
        };
        try{
          const r=await fetch('/.netlify/functions/central?type=armazem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
          const d=await r.json().catch(()=>({}));
          if(!r.ok){alert('Erro ao guardar: '+(d.error||r.status));return;}
          f.reset();
          f.closest('.modal-overlay').style.display='none';
          await fetchData();
        }catch(err){alert('Erro ao guardar: '+err.message);}
      }

      fetchData();
    </script>
